<title>Alone Cat</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;800&display=swap">
<style>
:root{
  --ink:#17131c;
  --ink-2:#221b2b;
  --cream:#f7efe2;
  --cream-dim:#c3b6ac;
  --ginger:#e8a24a;
  --ginger-hot:#ffc06b;
  --tummy:#f2c98a;
  --danger:#e0565c;
  --mint:#7fd6b0;
  --stroke:rgba(247,239,226,.14);
  --font-d:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --font-b:"Nunito","Segoe UI",system-ui,sans-serif;
}
html,body{height:100%;}
body{margin:0;background:var(--ink);color:var(--cream);font-family:var(--font-b);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
canvas{display:block;}
#stage{position:fixed;inset:0;z-index:0;}
#hud{position:fixed;inset:0;z-index:2;pointer-events:none;}
.panel{background:rgba(34,27,43,.82);border:1px solid var(--stroke);border-radius:14px;
  box-shadow:0 8px 26px rgba(0,0,0,.45);}

#vitals{position:absolute;left:14px;top:calc(12px + env(safe-area-inset-top,0px));
  padding:10px 12px 11px;width:min(240px,46vw);}
.lbl{font-family:var(--font-d);font-weight:800;font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--cream-dim);display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.lbl b{font-family:var(--font-b);font-weight:800;font-size:12px;letter-spacing:0;color:var(--tummy);
  font-variant-numeric:tabular-nums;}
#tummybar{margin-top:6px;height:15px;border-radius:9px;background:#140f1a;
  border:1px solid rgba(247,239,226,.12);overflow:hidden;position:relative;}
#tummyfill{height:100%;width:40%;border-radius:8px;
  background:linear-gradient(180deg,var(--ginger-hot),var(--tummy) 55%,#d9a35c);}
#tummybar.low #tummyfill{background:linear-gradient(180deg,#ff8f7a,var(--danger));}
#tummybar.low{animation:pulse 1.1s infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(224,86,92,0)}50%{box-shadow:0 0 0 4px rgba(224,86,92,.22)}}
#lives{display:flex;gap:5px;margin-top:11px;flex-wrap:wrap;}
.pip{width:12px;height:12px;border-radius:50%;background:var(--ginger);
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.25);position:relative;transition:.15s;}
.pip::after{content:"";position:absolute;left:3px;top:-3px;width:3px;height:3px;border-radius:50%;
  background:var(--ginger);box-shadow:5px 0 0 var(--ginger);}
.pip.off{background:#4a3f55;box-shadow:none;}
.pip.off::after{background:#4a3f55;box-shadow:5px 0 0 #4a3f55;}

#quest{position:absolute;right:14px;top:calc(12px + env(safe-area-inset-top,0px));
  padding:9px 13px 11px;max-width:min(270px,52vw);text-align:right;}
#day{font-family:var(--font-d);font-weight:800;font-size:11px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--ginger);}
#task{font-size:13px;line-height:1.35;margin-top:3px;color:var(--cream);}
#task .done{color:var(--mint);}

#say{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));
  width:min(560px,90vw);padding:11px 16px;text-align:center;font-size:15px;line-height:1.4;
  opacity:0;transition:opacity .25s;}
#say.on{opacity:1;}
#say .who{font-family:var(--font-d);font-weight:800;color:var(--ginger);margin-right:7px;}

#prompt{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(44px + env(safe-area-inset-bottom,0px));
  padding:7px 14px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .15s;white-space:nowrap;}
#prompt.on{opacity:1;}
kbd{font-family:var(--font-d);font-weight:800;font-size:12px;background:var(--ginger);color:#2a1a06;
  border-radius:6px;padding:2px 7px;margin-right:7px;box-shadow:0 2px 0 #a86d21;}

#floaters{position:absolute;inset:0;overflow:hidden;}
.float{position:absolute;font-family:var(--font-d);font-weight:800;font-size:17px;
  text-shadow:0 2px 6px rgba(0,0,0,.7);animation:floatup 1s ease-out forwards;}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,0) scale(.7)}
  15%{opacity:1;transform:translate(-50%,-10px) scale(1.1)}
  100%{opacity:0;transform:translate(-50%,-52px) scale(1)}}

#vignette{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 160px rgba(0,0,0,.75);}
#flash{position:absolute;inset:0;background:var(--danger);opacity:0;transition:opacity .28s;}
#stink{position:absolute;inset:0;opacity:0;transition:opacity .4s;
  background:radial-gradient(circle at 50% 60%,rgba(127,214,176,.42),rgba(127,214,176,0) 62%);}

#overlay{position:fixed;inset:0;z-index:4;display:none;place-items:center;padding:24px 16px;
  background:radial-gradient(circle at 50% 30%,rgba(35,26,46,.86),rgba(12,9,16,.96));overflow-y:auto;}
#overlay.on{display:grid;}
#overlay.title{align-items:start;background:linear-gradient(180deg,
  rgba(20,16,25,.95) 0%,rgba(20,16,25,.93) 44%,rgba(20,16,25,.55) 72%,rgba(20,16,25,.06) 100%);}
#overlay.title .card{background:rgba(34,27,43,.55);}
.build{margin-top:14px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#6d6478;}
.card{width:min(620px,100%);padding:26px 24px 22px;text-align:center;}
.card h1{font-family:var(--font-d);font-weight:800;margin:0;line-height:.95;
  font-size:clamp(38px,9vw,64px);color:var(--ginger);text-wrap:balance;
  text-shadow:0 4px 0 #a86d21,0 12px 26px rgba(0,0,0,.5);}
.card h2{font-family:var(--font-d);font-weight:800;margin:0 0 6px;font-size:clamp(24px,6vw,36px);
  color:var(--cream);text-wrap:balance;}
.card .kicker{font-family:var(--font-d);font-weight:800;letter-spacing:.24em;text-transform:uppercase;
  font-size:12px;color:var(--mint);margin-bottom:8px;}
.card p{font-size:15px;line-height:1.55;color:var(--cream-dim);max-width:46ch;margin:12px auto;}
.card p em{color:var(--cream);font-style:normal;font-weight:800;}
.style-pick{margin:4px 0 14px;font:700 13px var(--font-b,Nunito),sans-serif;letter-spacing:.06em;
  color:var(--cream);opacity:.9;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.stbtn{pointer-events:auto;font:800 13px var(--font-b,Nunito),sans-serif;padding:7px 12px;border-radius:999px;
  border:2px solid rgba(247,239,226,.35);background:transparent;color:var(--cream);cursor:pointer}
.stbtn.on{background:var(--cream);color:var(--ink);border-color:var(--cream)}
.btn{pointer-events:auto;font-family:var(--font-d);font-weight:800;font-size:17px;
  background:var(--ginger);color:#2a1a06;border:0;border-radius:12px;padding:12px 26px;cursor:pointer;
  box-shadow:0 4px 0 #a86d21;transition:transform .08s,box-shadow .08s;margin:16px 5px 0;}
.btn:hover{background:var(--ginger-hot);}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a86d21;}
.btn.ghost{background:transparent;color:var(--cream-dim);box-shadow:none;border:1px solid var(--stroke);
  font-size:14px;padding:10px 18px;}
.btn:focus-visible{outline:3px solid var(--mint);outline-offset:3px;}
.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 14px;
  margin:18px auto 4px;max-width:520px;text-align:left;}
.keys div{font-size:13px;color:var(--cream-dim);}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:18px 0 4px;}
.stat{background:rgba(23,19,28,.7);border:1px solid var(--stroke);border-radius:12px;padding:10px 8px;}
.stat b{display:block;font-family:var(--font-d);font-size:26px;color:var(--ginger);
  font-variant-numeric:tabular-nums;line-height:1.1;}
.stat span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--cream-dim);}

#beg{position:fixed;inset:0;z-index:5;display:none;place-items:center;
  background:rgba(12,9,16,.62);padding:16px;}
#beg.on{display:grid;}
#beg .card{width:min(460px,100%);}
#begbar{position:relative;height:36px;border-radius:12px;background:#140f1a;margin-top:16px;
  border:1px solid var(--stroke);overflow:hidden;}
#begzone{position:absolute;top:0;bottom:0;border-left:2px solid var(--mint);border-right:2px solid var(--mint);
  background:linear-gradient(180deg,rgba(127,214,176,.5),rgba(127,214,176,.18));}
#begmark{position:absolute;top:-3px;bottom:-3px;width:5px;border-radius:3px;background:var(--ginger-hot);
  box-shadow:0 0 12px var(--ginger-hot);}

#touch{position:absolute;inset:0;display:none;}
body.touch #touch{display:block;}
#stick{position:absolute;left:20px;bottom:calc(24px + env(safe-area-inset-bottom,0px));
  width:124px;height:124px;border-radius:50%;background:rgba(34,27,43,.55);
  border:1px solid var(--stroke);pointer-events:auto;touch-action:none;}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;
  background:var(--ginger);opacity:.85;box-shadow:0 3px 0 #a86d21;}
#tbtns{position:absolute;right:18px;bottom:calc(24px + env(safe-area-inset-bottom,0px));
  display:grid;grid-template-columns:repeat(2,1fr);gap:10px;pointer-events:auto;}
.tb{width:70px;height:70px;border-radius:50%;background:rgba(34,27,43,.72);border:1px solid var(--stroke);
  color:var(--cream);font-family:var(--font-d);font-weight:800;font-size:12px;letter-spacing:.06em;
  display:grid;place-items:center;touch-action:none;cursor:pointer;}
.tb:active{background:var(--ginger);color:#2a1a06;}
#tbClaw{background:rgba(232,162,74,.28);}

#corner{position:absolute;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));
  display:flex;gap:8px;pointer-events:auto;}
body.touch #corner{bottom:calc(116px + env(safe-area-inset-bottom,0px));}
.mini{width:34px;height:34px;border-radius:10px;background:rgba(34,27,43,.8);border:1px solid var(--stroke);
  color:var(--cream-dim);font-family:var(--font-d);font-weight:800;font-size:13px;cursor:pointer;
  display:grid;place-items:center;}
.mini:hover{color:var(--cream);}
#loading{position:fixed;inset:0;z-index:9;display:grid;place-items:center;background:var(--ink);
  font-family:var(--font-d);font-weight:800;color:var(--cream-dim);letter-spacing:.2em;font-size:13px;}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important}}
</style>

<div id="stage"></div>
<div id="hud" hidden>
  <div id="vignette"></div>
  <div id="stink"></div>
  <div id="flash"></div>
  <div id="vitals" class="panel">
    <div class="lbl">Tummy <b id="tummynum">40%</b></div>
    <div id="tummybar"><div id="tummyfill"></div></div>
    <div id="lives"></div>
  </div>
  <div id="quest" class="panel">
    <div id="day">Day 1 &middot; The Apartment</div>
    <div id="task">Wake up. Be hungry.</div>
  </div>
  <div id="say" class="panel"></div>
  <div id="prompt" class="panel"></div>
  <div id="floaters"></div>
  <div id="touch">
    <div id="stick"><div id="knob"></div></div>
    <div id="tbtns">
      <div class="tb" id="tbInteract">PAW</div>
      <div class="tb" id="tbClaw">SWIPE</div>
      <div class="tb" id="tbMeow">MEOW</div>
      <div class="tb" id="tbJump">JUMP</div>
    </div>
  </div>
  <div id="corner">
    <button class="mini" id="btnMute" title="Mute (M)">&#9835;</button>
    <button class="mini" id="btnPause" title="Pause (Esc)">II</button>
  </div>
</div>
<div id="overlay"><div class="card panel" id="card"></div></div>
<div id="beg">
  <div class="card panel">
    <div class="kicker">Begging</div>
    <h2 id="begwho">The Line Cook</h2>
    <p id="begtxt">Look as pathetic as humanly &mdash; catly &mdash; possible. Stop the meow in the soft spot.</p>
    <div id="begbar"><div id="begzone"></div><div id="begmark"></div></div>
    <button class="btn" id="begbtn">MEOW NOW</button>
  </div>
</div>
<div id="loading">STRETCHING&hellip;</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
<script>
(function(){
"use strict";
if(!window.THREE){document.getElementById('loading').textContent='COULD NOT LOAD 3D LIBRARY';return;}

/* ============================ tiny helpers ============================ */
var clamp=function(v,a,b){return v<a?a:(v>b?b:v);};
var lerp=function(a,b,t){return a+(b-a)*t;};
var rnd=function(a,b){return a+Math.random()*(b-a);};
var pick=function(a){return a[(Math.random()*a.length)|0];};
var $=function(id){return document.getElementById(id);};
var V=function(x,y,z){return new THREE.Vector3(x,y,z);};

/* ============================ audio (procedural) ============================ */
var AU={ctx:null,muted:false,init:function(){
  if(this.ctx)return; try{
    var C=window.AudioContext||window.webkitAudioContext; if(!C)return;
    this.ctx=new C(); this.bus=this.ctx.createGain(); this.bus.gain.value=.5; this.bus.connect(this.ctx.destination);
    this.loadSamples();
  }catch(e){}
},
tone:function(f0,f1,dur,type,vol,slideCurve){
  if(!this.ctx||this.muted)return; var c=this.ctx,t=c.currentTime;
  var o=c.createOscillator(),g=c.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f0,t);
  if(slideCurve==='exp'){o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);}
  else{o.frequency.linearRampToValueAtTime(Math.max(20,f1),t+dur);}
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol||.2,t+.012);
  g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g); g.connect(this.bus); o.start(t); o.stop(t+dur+.05);
},
noise:function(dur,cut,vol,sweepTo){
  if(!this.ctx||this.muted)return; var c=this.ctx,t=c.currentTime;
  var n=(c.sampleRate*dur)|0, buf=c.createBuffer(1,n,c.sampleRate), d=buf.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=c.createBufferSource(); s.buffer=buf;
  var f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.setValueAtTime(cut,t);
  if(sweepTo)f.frequency.exponentialRampToValueAtTime(sweepTo,t+dur);
  f.Q.value=1.2;
  var g=c.createGain(); g.gain.setValueAtTime(vol||.2,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(f); f.connect(g); g.connect(this.bus); s.start(t);
},
meow:function(){ this.tone(520,760,.14,'sawtooth',.11); var s=this;
  setTimeout(function(){s.tone(700,430,.34,'sawtooth',.13,'exp');},110); },
purr:function(){ this.tone(58,44,.7,'triangle',.14); },
chomp:function(){ this.noise(.09,900,.22,320); var s=this; setTimeout(function(){s.noise(.08,700,.16,260);},110); },
hit:function(){ this.noise(.09,1800,.25,400); this.tone(320,90,.14,'square',.12,'exp'); },
hurt:function(){ this.tone(660,140,.34,'sawtooth',.16,'exp'); },
jump:function(){ this.tone(300,640,.11,'sine',.1); },
land:function(){ this.noise(.07,380,.12); },
pickup:function(){ this.tone(600,600,.08,'triangle',.14); var s=this;
  setTimeout(function(){s.tone(900,900,.13,'triangle',.13);},80); },
growl:function(){ this.tone(110,72,.5,'sawtooth',.13,'exp'); },
bark:function(){ this.tone(230,120,.1,'square',.16,'exp'); },
chitter:function(){ var s=this; for(var i=0;i<4;i++)(function(k){setTimeout(function(){s.tone(900+k*70,700,.05,'square',.07);},k*55);})(i); },
spray:function(){ this.noise(.55,600,.2,180); },
win:function(){ var s=this,n=[523,659,784,1046]; n.forEach(function(f,i){setTimeout(function(){s.tone(f,f,.22,'triangle',.14);},i*110);}); },
lose:function(){ var s=this,n=[440,392,330,247]; n.forEach(function(f,i){setTimeout(function(){s.tone(f,f*.98,.3,'sawtooth',.12);},i*150);}); },
door:function(){ this.noise(.4,240,.16,90); },
scratch:function(){ this.noise(.16,2600,.2,900); }
};

/* ============================ renderer ============================ */
var renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
if(THREE.sRGBEncoding)renderer.outputEncoding=THREE.sRGBEncoding;
$('stage').appendChild(renderer.domElement);
/* Real cat recordings, CC0 from BigSoundBank, fetched once the audio context is
   alive. Every one of them is optional: if a file 404s, is still downloading, or
   the browser refuses to decode it, the synthesised version underneath plays
   instead, so the game never goes silent. */
var SND={
  meow:['snd/1889.mp3','snd/1890.mp3','snd/1891.mp3','snd/1473.mp3'],
  purr:['snd/0436.mp3'],
  growl:['snd/1885.mp3','snd/1886.mp3'],
  hurt:['snd/1886.mp3']
};
AU.buf={};
AU.loadSamples=function(){
  if(this.loading||!this.ctx)return; this.loading=true;
  var A=this;
  Object.keys(SND).forEach(function(k){
    SND[k].forEach(function(url){
      if(A.buf[url]!==undefined)return;
      A.buf[url]=null;
      try{
        var r=new XMLHttpRequest();
        r.open('GET',url,true); r.responseType='arraybuffer';
        r.onload=function(){
          if(r.status!==200)return;
          try{ A.ctx.decodeAudioData(r.response,function(b){ A.buf[url]=b; },function(){}); }
          catch(e){}
        };
        r.send();
      }catch(e){}
    });
  });
};
/* play a loaded clip; returns false if we have not got one, so the caller falls
   back to the synth. maxDur clips the long recordings down to a usable bark. */
AU.sample=function(kind,vol,maxDur,rate){
  if(!this.ctx||this.muted)return false;
  var list=SND[kind]; if(!list)return false;
  var ready=[];
  for(var i=0;i<list.length;i++)if(this.buf[list[i]])ready.push(this.buf[list[i]]);
  if(!ready.length)return false;
  var b=ready[(Math.random()*ready.length)|0];
  try{
    var s=this.ctx.createBufferSource(); s.buffer=b;
    s.playbackRate.value=rate||(0.94+Math.random()*0.12);   // never quite the same twice
    var g=this.ctx.createGain(); g.gain.value=(vol===undefined?.7:vol);
    s.connect(g); g.connect(this.bus);
    var d=Math.min(maxDur||b.duration,b.duration/s.playbackRate.value);
    var t=this.ctx.currentTime;
    g.gain.setValueAtTime(g.gain.value,t+Math.max(0,d-.12));
    g.gain.exponentialRampToValueAtTime(.001,t+d);           // fade the cut, no click
    s.start(t,0,d+.02);
  }catch(e){ return false; }
  return true;
};
var AU_SYNTH={};
/* the recordings take over these four; the synth stays as the safety net */
['meow','purr','growl','hurt'].forEach(function(k){ AU_SYNTH[k]=AU[k]; });
AU.meow =function(){ if(!this.sample('meow',.75,1.6))AU_SYNTH.meow.call(this); };
AU.purr =function(){ if(!this.sample('purr',.5,1.5))AU_SYNTH.purr.call(this); };
AU.growl=function(){ if(!this.sample('growl',.6,1.2))AU_SYNTH.growl.call(this); };
AU.hurt =function(){ if(!this.sample('hurt',.7,.9,1.25))AU_SYNTH.hurt.call(this); };
var scene=new THREE.Scene();
var camera=new THREE.PerspectiveCamera(58,1,.08,400);
function resize(){
  var w=window.innerWidth,h=window.innerHeight;
  camera.aspect=w/h; camera.updateProjectionMatrix(); renderer.setSize(w,h);
}
window.addEventListener('resize',resize); resize();

/* ============================ material helpers ============================ */
var matCache={};
function M(color,opts){
  opts=opts||{}; var key=color+'|'+(opts.flat?1:0)+'|'+(opts.op||1)+'|'+(opts.emissive||0);
  if(matCache[key])return matCache[key];
  var m=new THREE.MeshLambertMaterial({color:color,flatShading:!!opts.flat});
  if(opts.op!==undefined&&opts.op<1){m.transparent=true;m.opacity=opts.op;}
  if(opts.emissive)m.emissive=new THREE.Color(opts.emissive);
  matCache[key]=m; return m;
}
var GEO={
  sphere:new THREE.SphereGeometry(1,16,12),
  sphereLo:new THREE.SphereGeometry(1,10,8),
  box:new THREE.BoxGeometry(1,1,1),
  cyl:new THREE.CylinderGeometry(1,1,1,12),
  cone:new THREE.ConeGeometry(1,1,10),
  plane:new THREE.PlaneGeometry(1,1)
};
function mesh(geo,mat,x,y,z,sx,sy,sz){
  var m=new THREE.Mesh(geo,mat); m.position.set(x||0,y||0,z||0);
  m.scale.set(sx===undefined?1:sx, sy===undefined?(sx===undefined?1:sx):sy, sz===undefined?(sx===undefined?1:sx):sz);
  m.castShadow=true; m.receiveShadow=true; return m;
}
function sph(c,x,y,z,sx,sy,sz,flat){return mesh(GEO.sphere,M(c,{flat:flat}),x,y,z,sx,sy,sz);}

/* ============================ the apartment texture atlas ============================
   apt_tex.jpg is a 4x3 grid of painted materials. Each cell is cut out into its own
   canvas texture so it can tile freely; an atlas sub-rect cannot repeat on its own. */
var APT={tex:{},ready:false};
var APT_NAMES=['floor','wallpaper','tile','worktop','fridge','cabinet',
               'sofa','duvet','hex','brick','carpet','curtain'];
var ALLEY_NAMES=['brick1','brick2','asphalt','concrete','dumpster','corrugated',
                 'plywood','chainlink','cardboard','binbag','advert','drainiron'];
function loadAtlas(url,names,done){
  var img=new Image();
  img.onload=function(){
    var cw=img.width/4, ch=img.height/3;
    for(var i=0;i<12;i++){
      var c=document.createElement('canvas'); c.width=256; c.height=256;
      c.getContext('2d').drawImage(img,(i%4)*cw,((i/4)|0)*ch,cw,ch,0,0,256,256);
      var t=new THREE.CanvasTexture(c);
      t.wrapS=t.wrapT=THREE.RepeatWrapping;
      APT.tex[names[i]]=t;
    }
    APT.ready=true; done&&done();
  };
  img.onerror=function(){ done&&done(); };
  img.src=url;
}
var SEWER_NAMES=['wetbrick','slimewall','blackwater','ironplate','moldtile','brickarch',
                 'pipewall','dripwall','cobbles','peelplaster','steelmesh','sludge'];
var JUNK_NAMES=['carred','carblue','rustbonnet','tyre','oildirt','scrapiron',
                'corrfence','crackglass','mudtracks','tincans','grease','plasticsheet'];
function loadAptTextures(done){
  loadAtlas('apt_tex.jpg',APT_NAMES,function(){
    loadAtlas('alley_tex.jpg',ALLEY_NAMES,function(){
      loadAtlas('sewer_tex.jpg',SEWER_NAMES,function(){
        loadAtlas('junk_tex.jpg',JUNK_NAMES,done);
      });
    });
  });
}
function texMat(name,rx,ry,tint,flat){
  var t=APT.tex[name];
  if(!t)return M(tint||0xbbbbbb,{flat:!!flat});
  var t2=t.clone(); t2.needsUpdate=true;
  t2.wrapS=t2.wrapT=THREE.RepeatWrapping;
  t2.repeat.set(Math.max(.05,rx||1),Math.max(.05,ry||1));
  return new THREE.MeshLambertMaterial({map:t2,color:tint||0xffffff,flatShading:!!flat});
}

var CAT_ORANGE=0xe8a24a, CAT_DARK=0xc97f2c, CAT_CREAM=0xf7e6cb, PINK=0xf0a3ae, EYEG=0x9ce07a;

function fluffBall(color,x,y,z,r,n,spread){
  var g=new THREE.Group(); g.position.set(x,y,z);
  for(var i=0;i<n;i++){
    var a=Math.random()*Math.PI*2, b=Math.acos(rnd(-1,1)), rr=r*rnd(.28,.46);
    var d=r*spread;
    g.add(sph(color,Math.sin(b)*Math.cos(a)*d,Math.cos(b)*d,Math.sin(b)*Math.sin(a)*d,rr,rr,rr,true));
  }
  return g;
}

/* Tabby markings are painted into a canvas texture, not built out of geometry.
   On a Y-up sphere the U axis wraps around the body, so a vertical bar in the
   image becomes a stripe running over the spine and down both flanks. */
function furTexture(bars,len,base,stripe){
  var c=document.createElement('canvas'); c.width=512; c.height=256;
  var x=c.getContext('2d');
  x.fillStyle=base; x.fillRect(0,0,512,256);
  x.globalAlpha=.35; x.fillStyle=stripe;
  for(var d=0;d<40;d++){                                   // faint dapple, breaks up the flat fill
    x.beginPath(); x.ellipse(Math.random()*512,Math.random()*256,rnd(10,34),rnd(6,18),0,0,6.3); x.fill();
  }
  x.globalAlpha=1; x.fillStyle=stripe;
  var step=512/bars;
  for(var i=0;i<bars;i++){
    var cx=i*step+step*.5+rnd(-step*.18,step*.18);
    var w=step*rnd(.28,.46), h=len*rnd(.72,1.18), drift=rnd(-w,w);
    x.beginPath();
    x.moveTo(cx-w/2,-4); x.lineTo(cx+w/2,-4);
    x.quadraticCurveTo(cx+w*.34+drift,h*.66,cx+drift+w*.10,h);
    x.quadraticCurveTo(cx+drift-w*.10,h*.98,cx+drift-w*.14,h*.92);
    x.quadraticCurveTo(cx-w*.34+drift,h*.6,cx-w/2,-4);
    x.fill();
  }
  var t=new THREE.CanvasTexture(c);
  t.wrapS=THREE.RepeatWrapping; t.wrapT=THREE.ClampToEdgeWrapping;
  return t;
}
var FURMAT=null;
function furMats(){
  if(FURMAT)return FURMAT;
  FURMAT={
    body:new THREE.MeshLambertMaterial({map:furTexture(15,150,'#e8a24a','#c9722a'),flatShading:true}),
    head:new THREE.MeshLambertMaterial({map:furTexture(22,74,'#e8a24a','#c9722a'),flatShading:true}),
    tail:new THREE.MeshLambertMaterial({map:furTexture(9,190,'#e8a24a','#c9722a'),flatShading:true})
  };
  return FURMAT;
}

function makeCat(){
  var CREAM=0xf2e3cb;
  var F=furMats();
  var g=new THREE.Group();
  var body=new THREE.Group(); g.add(body);

  /* --- the loaf --- */
  body.add(mesh(GEO.sphere,F.body,0,.58,0,.74,.60,.82));
  body.add(mesh(GEO.sphere,F.body,0,.54,-.42,.66,.54,.44));        // rump
  body.add(sph(CREAM,0,.32,.16,.58,.40,.62,true));                 // belly, low and heavy
  body.add(fluffBall(CAT_ORANGE,0,.44,-.62,.30,6,.5));             // hip tufts

  /* --- the cream bib: pointed tufts down the chest --- */
  body.add(sph(CREAM,0,.44,.56,.36,.32,.22,true));
  for(var t=0;t<5;t++){
    var tf=cone(CREAM,(t-2)*.14,.26,.6-Math.abs(t-2)*.05,.11,.36);
    tf.rotation.x=Math.PI+.18; body.add(tf);
  }
  body.add(sph(CREAM,-.42,.5,.4,.16,.2,.14,true));
  body.add(sph(CREAM,.42,.5,.4,.16,.2,.14,true));

  /* --- short legs, small cream paws --- */
  var legs=[], lp=[[-.38,.62],[.38,.62],[-.4,-.42],[.4,-.42]];
  for(var j=0;j<4;j++){
    var L=new THREE.Group(); L.position.set(lp[j][0],.24,lp[j][1]);
    L.add(cyl(CAT_ORANGE,0,-.07,0,.15,.16));
    L.add(sph(CREAM,0,-.17,.04,.17,.12,.2,true));
    L.userData.baseY=L.position.y;
    body.add(L); legs.push(L);
  }

  /* --- the plume: banded, upright, cream at the tip --- */
  var tail=[], tg=new THREE.Group(); tg.position.set(0,.72,-.72); tg.rotation.x=-.55; body.add(tg);
  var seg=tg;
  for(var k=0;k<6;k++){
    var s2=new THREE.Group(); s2.position.set(0,k===0?.1:0,-.2);
    var r=.25-k*.014;
    if(k>=4)s2.add(sph(CREAM,0,0,-.06,r,r,r*1.1,true));
    else s2.add(mesh(GEO.sphere,k%2?F.tail:F.body,0,0,-.06,r,r,r*1.1));
    seg.add(s2); seg=s2; tail.push(s2);
  }
  seg.add(sph(CREAM,0,0,-.18,.2,.2,.2,true));

  /* --- head: low, wide, extremely cheeked --- */
  var head=new THREE.Group(); head.position.set(0,.97,.54); body.add(head);
  head.add(mesh(GEO.sphere,F.head,0,0,0,.38,.35,.36));
  head.add(mesh(GEO.sphere,F.head,-.34,-.06,.02,.22,.2,.18));      // cheek floof
  head.add(mesh(GEO.sphere,F.head,.34,-.06,.02,.22,.2,.18));
  head.add(sph(CREAM,-.34,-.09,.13,.15,.13,.12,true));
  head.add(sph(CREAM,.34,-.09,.13,.15,.13,.12,true));
  head.add(sph(CREAM,0,-.12,.3,.21,.15,.15,true));                 // muzzle
  head.add(sph(CREAM,0,.19,.2,.19,.09,.13,true));                  // brow flash
  var nose=cone(PINK,0,-.04,.38,.06,.075); nose.rotation.x=Math.PI; head.add(nose);

  var eyes=[];
  [-1,1].forEach(function(sgn){
    var e=new THREE.Group(); e.position.set(sgn*.17,.06,.3); head.add(e);
    e.add(sph(0xf2e3cb,0,0,-.01,.115,.115,.05,false));
    e.add(sph(EYEG,0,0,0,.1,.1,.055,false));
    e.add(sph(0x1d1520,0,0,.045,.038,.085,.045,false));
    e.add(sph(0xffffff,.04,.045,.06,.025,.025,.02,false));
    eyes.push(e);
  });

  var ears=[];
  [-1,1].forEach(function(sgn){
    var E=new THREE.Group(); E.position.set(sgn*.25,.26,-.02); E.rotation.z=-sgn*.3; head.add(E);
    E.add(cone(CAT_ORANGE,0,.12,0,.15,.34));
    E.add(cone(PINK,0,.1,.04,.085,.22));
    E.add(cone(CREAM,sgn*.06,.16,.03,.05,.22));
    E.add(cone(CREAM,sgn*-.03,.18,.02,.04,.2));
    ears.push(E);
  });

  [-1,1].forEach(function(sgn){
    for(var w=0;w<3;w++){
      var wh=cyl(0xf6ece0,sgn*.26,-.05+w*.05,.28,.008,.4);
      wh.rotation.z=Math.PI/2-sgn*(.35-w*.18); wh.rotation.y=-sgn*.5; wh.castShadow=false;
      head.add(wh);
    }
  });

  g.userData={body:body,head:head,legs:legs,tail:tail,tailBase:tg,ears:ears,eyes:eyes};
  return g;
}

  var m=wallArt(i,x,y,z,yaw,h,sheet);

  W.ticks.push(function(){
    var d=(camera.position.x-x)*Math.sin(yaw)+(camera.position.z-z)*Math.cos(yaw);
    if(!flipped&&d<-0.55)flipped=true;          // a dead zone either side of edge-on
    else if(flipped&&d>0.55)flipped=false;      // stops it flickering when you stand level
    m.rotation.y=yaw+(flipped?Math.PI:0);

   with the turnaround's four square-on views pasted on its four sides. It never
   rotates, because there is nothing to rotate: you walk around a solid thing and
   the sides come into view the way they should. */
function faceMat(S,idx,mirror){
  var f=S.frames[idx];
  var u0=f[0]/S.W, v0=1-f[3]/S.H, uw=(f[2]-f[0])/S.W, vh=(f[3]-f[1])/S.H;
  return new THREE.ShaderMaterial({
    uniforms:{map:{value:S.texfn()},
      uRect:{value:new THREE.Vector4(u0,v0,uw,vh)},
      uMir:{value:mirror?1.0:0.0}},
    vertexShader:'varying vec2 vUv; void main(){vUv=uv;'+
      'gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
    fragmentShader:['uniform sampler2D map; uniform vec4 uRect; uniform float uMir;',
      'varying vec2 vUv;',
      'void main(){',
      '  vec2 q=vUv; if(uMir>0.5)q.x=1.0-q.x;',
      '  vec4 c=texture2D(map,uRect.xy+q*uRect.zw);',
      '  if(c.a<0.35)discard;',
      '  gl_FragColor=vec4(c.rgb,1.0);',

var ZPOOL=[];
function spawnZ(x,y,z,size,ch){
  var s=null;
  for(var i=0;i<ZPOOL.length;i++){ if(!ZPOOL[i].live){ s=ZPOOL[i]; break; } }
  if(!s){
    if(ZPOOL.length>=20)return;
    var m=new THREE.Mesh(new THREE.PlaneGeometry(1,1),
      new THREE.MeshBasicMaterial({map:zTexture('z'),transparent:true,depthWrite:false,
        depthTest:false,opacity:0}));
    m.renderOrder=40; m.frustumCulled=false;
    scene.add(m);
    s={mesh:m,live:false,t:0,x:0,y:0,z:0,size:1,sway:0};
    ZPOOL.push(s);
  }
  s.mesh.material.map=zTexture(ch||'z');
  s.live=true; s.t=0; s.x=x; s.y=y; s.z=z; s.size=size;
  s.sway=Math.random()*6.28;
  s.mesh.visible=true;
}
function updateZ(dt){
  for(var i=0;i<ZPOOL.length;i++){
    var s=ZPOOL[i]; if(!s.live)continue;
    s.t+=dt;
    var L=4.2;
    if(s.t>=L){ s.live=false; s.mesh.visible=false; continue; }
    var k=s.t/L;
    var m=s.mesh;
    m.position.set(s.x+Math.sin(s.sway+s.t*1.9)*.15, s.y+s.t*.52, s.z);
    var sc=s.size*(.55+k*.85);
    m.scale.set(sc,sc,1);
    m.rotation.set(0,Math.atan2(camera.position.x-m.position.x,
                                camera.position.z-m.position.z),
                   Math.sin(s.sway+s.t*2.1)*.22);
    m.material.opacity=(k<.12)?(k/.12):(k>.62?(1-(k-.62)/.38):1);
  }
}

function animCard(S,x,y,z,h,yaw,fps){
  var m=wallArt(0,x,y+h/2,z,yaw||0,h,S);
  var n=S.frames.length, acc=0, cur=0, step=1/(fps||6);

function updateCatSprite(g,yaw,opt){
  opt=opt||{};
  var u=g.userData, m=u.mat;
  var vx=g.position.x-camera.position.x, vz=g.position.z-camera.position.z;
  var l=Math.sqrt(vx*vx+vz*vz)||1; vx/=l; vz/=l;
  var DS=u.sheet||SHEET;
  var bearing=Math.atan2(-vx,-vz);                         // y-axis billboard: always upright
  if(opt.faceYaw!==undefined){
    yaw=opt.faceYaw;                                       // its heading never changes, so
    if(opt.snap!==false){                                  // circling it shows its sides and back
      var STEP=Math.PI/4, rel=bearing-yaw;
      bearing=yaw+Math.round(rel/STEP)*STEP;               // hold still between viewpoints
    }

  g.rotation.set(0,bearing,0);
  var fx=Math.sin(yaw), fz=Math.cos(yaw);
  var a=Math.atan2(fx*vz-fz*vx, fx*vx+fz*vz);              // 0 = we are behind him
  var t=((a+Math.PI)/(Math.PI*2))*8;
  var dir=(opt.dir!==undefined)?opt.dir:DS.dir;
  var i=Math.round(dir>0?t:(8-t))%8; if(i<0)i+=8;

  var act=(opt.act===undefined?-1:opt.act);
  var key=(stat>=0)?('s'+stat):((act>=0&&DS.act)?('a'+act):((idle>=0)?('i'+idle):('d'+i)));
  if(key!==u.frameKey){
    u.frameKey=key;
    var AC=(act>=0&&DS.act)?DS.act:null;
    var S=(stat>=0)?STATUS:(AC?AC:((idle>=0)?IDLE:DS));
    var f=(stat>=0)?STATUS.frames[stat]:(AC?AC.frames[act]:((idle>=0)?IDLE.frames[idle]:DS.frames[DS.order[i]]));
    m.uniforms.map.value=(stat>=0)?statusTexture()
      :(AC?AC.texfn():((idle>=0)?idleTexture():(DS.texfn?DS.texfn():sheetTexture())));
    var sbg=S.bg||[.5,.5,.5];                       // cut-out sheets carry no key colour
    m.uniforms.uBG.value.set(sbg[0],sbg[1],sbg[2]);
    m.uniforms.uRect.value.set(f[0]/S.W,1-f[3]/S.H,(f[2]-f[0])/S.W,(f[3]-f[1])/S.H);
    u.aspect=(f[2]-f[0])/(f[3]-f[1]);
    u.mir=(DS.mirror&&stat<0&&act<0&&idle<0&&DS.mirror[i])?-1:1;
    u.hWorld=(stat>=0)?STATUS.height*((f[3]-f[1])/STATUS.refH)
            :(AC?AC.height*((f[3]-f[1])/AC.refH)
            :((idle>=0)?IDLE.height*((f[3]-f[1])/IDLE.refH)
            :(DS.refH?DS.height*((f[3]-f[1])/DS.refH):DS.height)));

  u.card.position.y=opt.lift||0;

}

function buildCityOutside(){

  (function(){

    function deck(cx,cz,w,d,yTop,solid){
      noShadow(bx(M1,cx,yTop-.11,cz,w,.22,d));

/* ---- walls built as segments, so windows and doorways are REAL holes with real collision ---- */
function wallRun(axis,fixed,from,to,h,th,color,holes,interior){
  var mk=function(a,b,y0,y1){
    if(b-a<.02||y1-y0<.02)return;
    var o={flat:true,tex:'wallpaper',texScale:.3,tint:0xf2ece2};
    var m=(axis==='x')?plat(color,(a+b)/2,y0,fixed,b-a,y1-y0,th,o)
                      :plat(color,fixed,y0,(a+b)/2,th,y1-y0,b-a,o);
    if(interior){
      m.material=m.material.clone();      // its own material so it can fade on its own
      var c=W.colliders[W.colliders.length-1];
      c.noCam=true;                       // the camera passes through: it fades instead
      W.fadeWalls.push({m:m,c:c});
    }
  };
  holes=(holes||[]).slice().sort(function(p,q){return p.c-q.c;});
  var cur=from;
  holes.forEach(function(H){
    var a=H.c-H.w/2, b=H.c+H.w/2;
    mk(cur,a,0,h); mk(a,b,0,H.y0); mk(a,b,H.y1,h); cur=b;
  });
  mk(cur,to,0,h);
}
function winGlass(axis,c,fixed,w){
  var m=(axis==='x')?bx(0x35507a,c,2.6,fixed,w-.08,1.56,.06):bx(0x35507a,fixed,2.6,c,.06,1.56,w-.08);
  m.material=new THREE.MeshLambertMaterial({color:0x35507a,transparent:true,opacity:.5,
    emissive:new THREE.Color(0x101d33)});
  m.castShadow=false; return deco(m);
}
function winDress(axis,c,fixed,w,inward,frameC,noGlass){
  frameC=frameC||0x8d7a62;
  if(axis==='x'){
    plat(frameC,c,1.8,fixed+inward*.30,w,.25,.5,{tag:'sill'});
    deco(bx(frameC,c-w/2,2.6,fixed,.14,1.8,.34)); deco(bx(frameC,c+w/2,2.6,fixed,.14,1.8,.34));
    deco(bx(frameC,c,3.4,fixed,w+.3,.16,.34));
    deco(bx(frameC,c,2.6,fixed,.08,1.56,.2));
  }else{
    plat(frameC,fixed+inward*.30,1.8,c,.5,.25,w,{tag:'sill'});
    deco(bx(frameC,fixed,2.6,c-w/2,.34,1.8,.14)); deco(bx(frameC,fixed,2.6,c+w/2,.34,1.8,.14));
    deco(bx(frameC,fixed,3.4,c,.34,.16,w+.3));
    deco(bx(frameC,fixed,2.6,c,.2,1.56,.08));
  }
  var cw=texMat('curtain',.5,1.6,0xe8c070);
  if(axis==='x'){
    [-1,1].forEach(function(s){
      var cm=bx(0xd8a84a,c+s*(w/2+.26),2.62,fixed+inward*.30,.62,2.0,.16);
      cm.material=cw; deco(cm);
    });
  } else {
    [-1,1].forEach(function(s){
      var cm=bx(0xd8a84a,fixed+inward*.30,2.62,c+s*(w/2+.26),.16,2.0,.62);
      cm.material=cw; deco(cm);
    });
  }
  if(!noGlass){            // closed windows are solid: no accidental three-storey exits
    winGlass(axis,c,fixed,w);
    if(axis==='x')addCol(c,2.6,fixed,w/2,.8,.16); else addCol(fixed,2.6,c,.16,.8,w/2);
  }
}
function roomLight(x,y,z,color,intensity,dist){
  var L=new THREE.PointLight(color,intensity,dist||13,2); L.position.set(x,y,z); W.root.add(L);

  deco(cyl(0x3a3340,x,y+.5,z,.03,.7));

}

/* ============================ lighting ============================ */
function setSky(bg,fogColor,fogDensity){
  scene.background=new THREE.Color(bg);
  scene.fog=fogDensity?new THREE.FogExp2(fogColor,fogDensity):null;
}
function addLights(o){
  var hemi=new THREE.HemisphereLight(o.hemi,o.ground,o.hemiI);
  W.root.add(hemi);
  var sun=new THREE.DirectionalLight(o.sunColor||0xffffff,o.sunI);
  sun.position.set(o.sunPos[0],o.sunPos[1],o.sunPos[2]);
  sun.castShadow=true;
  var s=o.size||20;

function spawnPrey(kind,x,z,opt){
  opt=opt||{};
  var g=(kind==='rat')?makeRat():makePigeon();
  g.position.set(x,0,z); W.root.add(g);
  var fast=(kind==='rat')?5.0:4.6;
  var o={x:x,y:0,z:z,vx:0,vz:0,t:Math.random()*8,dead:false,fleeT:0,state:'calm'};
  W.ticks.push(function(dt){
    if(o.dead)return true;
    o.t+=dt;
    var dx=P.pos.x-o.x, dz=P.pos.z-o.z, d=Math.sqrt(dx*dx+dz*dz)||.001;
    if(d<1.35&&P.atkT>0&&Math.abs(P.pos.y-o.y)<1.4){
      o.dead=true; W.root.remove(g); AU.chomp(); AU.purr();
      P.hunger=clamp(P.hunger+opt.food,0,100); GAME.meals++; GAME.hunts=(GAME.hunts||0)+1;
      puff(o.x,.5,o.z,kind==='rat'?0x6a5a4a:0xc8ccd4,16);
      floatText(o.x,1.1,o.z,'+'+opt.food+' tummy','#f2c98a');
      say('Biscuits',opt.line,4.2);
      return true;
    }
    var noisy=(kind==='rat')?(d<5.2):(d<3.6&&P.speed>1.9&&!P.stalk);
    if(noisy||o.state==='flee'){
      o.state='flee'; o.fleeT+=dt;
      o.vx=-dx/d*fast; o.vz=-dz/d*fast;
      if(kind==='pigeon'&&o.fleeT>.3){
        g.position.y+=dt*5.5; g.rotation.z=Math.sin(o.t*26)*.45;
        if(g.position.y>8){ o.dead=true; W.root.remove(g); return true; }
      }
      if(o.fleeT>3.2&&kind==='rat'){ o.state='calm'; o.fleeT=0; }
    } else {
      o.state='calm'; o.fleeT=0;
      o.vx*=.88; o.vz*=.88;
      if(kind==='pigeon'){
        g.position.y=Math.abs(Math.sin(o.t*2.4))*.04;
        g.rotation.y=Math.sin(o.t*.5)*1.5;
        if(Math.sin(o.t*.9)>.88){ o.vx=Math.sin(o.t*2.6)*.7; o.vz=Math.cos(o.t*2.1)*.7; }
      } else {
        o.vx=Math.sin(o.t*.45)*2.2; o.vz=Math.cos(o.t*.33)*1.5;
      }
    }
    o.x+=o.vx*dt; o.z+=o.vz*dt;
    circlePush(o,.3);
    g.position.x=o.x; g.position.z=o.z;
    if(Math.abs(o.vx)+Math.abs(o.vz)>.05&&kind!=='pigeon')g.rotation.y=Math.atan2(o.vx,o.vz);
    return false;
  });
  return o;
}
function tintCat(g,color){
  var tinted={};
  g.traverse(function(o){
    if(!o.isMesh||!o.material||!o.material.color)return;
    if(o.material.map){                       // textured fur: keep the stripes, shift the hue
      var id=o.material.uuid;
      if(!tinted[id]){ var m2=o.material.clone(); m2.color=new THREE.Color(color); tinted[id]=m2; }
      o.material=tinted[id];
    } else if(o.material.color.getHex()===0xe8a24a)o.material=M(color);
  });
}

/* ============================ LEVEL 3 — the sewers ============================
   A hand-authored maze. 9x9 cells, 5 units each. The Raccoon King sits in the
   middle and will not open his gate for nothing. */
var SEWER_MAP=[
  '#################',
  '#S..#...#.......#',
  '###.#.#.#######.#',
  '#...#.#.#.....#.#',
  '#.###.#.#.###.#.#',
  '#.#...#.#...#...#',
  '#.#...#.###.###.#',
  '#.#.#.......#..C#',
  '#.#.#...K.###..##',
  '#...#.....#.....#',
  '##.##.###.#.###.#',
  '#.........#C..#.#',
  '#.#####.#.#.#.#.#',
  '#...#...#.......#',
  '##..#.#.#.###..##',
  '#.....#C.......C#',
  '###############E#'
];
function buildSewer(){
  var CELL=4.2, N=17, half=(N-1)/2;
  function wx(c){ return (c-half)*CELL; }
  function wz(r){ return (r-half)*CELL; }
  slab(0x4a4a44,0,.02,0,N*CELL+8,N*CELL+8,'cobbles',.30);
  var kingCell=null, exitCell=null, startCell=null, caps=[];
  for(var r=0;r<N;r++)for(var c=0;c<N;c++){
    var ch=SEWER_MAP[r][c];
    if(ch==='#'){
      var wtex=((r+c)%5===0)?'moldtile':(((r*c)%7===0)?'slimewall':'wetbrick');
      var wm=plat(0x5a5a52,wx(c),0,wz(r),CELL,4.2,CELL,{flat:true,tex:wtex,texScale:.3,tint:0xffffff});
      wm.material=wm.material.clone();
      var wc=W.colliders[W.colliders.length-1];
      wc.noCam=true;                       // never shove the camera in a maze
      W.fadeWalls.push({m:wm,c:wc});
    } else {
      if(ch==='S')startCell=[c,r];
      if(ch==='K')kingCell=[c,r];
      if(ch==='E')exitCell=[c,r];
      if(ch==='C')caps.push([c,r]);
    }
  }
  // a channel of water down the bottom corridor, and puddles elsewhere
  var water=new THREE.Mesh(new THREE.PlaneGeometry(N*CELL-6,2.4),
    new THREE.MeshLambertMaterial({color:0x3f5a52,transparent:true,opacity:.62,
      emissive:new THREE.Color(0x12201c)}));
  water.rotation.x=-Math.PI/2; water.position.set(0,.06,wz(7)); W.root.add(water);
  var deepw=new THREE.Mesh(new THREE.PlaneGeometry(N*CELL-6,2.0),
    texMat('blackwater',3,.6,0xcfd8d4));
  deepw.rotation.x=-Math.PI/2; deepw.position.set(0,.04,wz(7)); W.root.add(deepw);
  W.ticks.push(function(dt,t){ water.position.x=Math.sin(t*.3)*.25; return false; });
  // dripping pipes along the walls
  for(var p=0;p<10;p++){                    // bolted to a wall, floor to ceiling
    var pc=1+((p*5)%(N-2)), pr=1+((p*7)%(N-2));
    if(SEWER_MAP[pr][pc]!=='#')continue;
    deco(cyl(0x6a6258,wx(pc)+(p%2?CELL/2:-CELL/2),2.1,wz(pr),.16,4.2));
  }
  // shafts of light from street grates overhead, and the water that comes with them
  [[1,1],[7,3],[3,7],[5,5]].forEach(function(g,gi){
    var gx=wx(g[0]), gz=wz(g[1]);
    deco(bx(0x2a2a26,gx,4.16,gz,2.2,.18,2.2));
    // the shaft stops above head height and never writes depth: walk into one of
    // these and it used to swallow the cat whole
    var shaft=bx(0xd8e0c0,gx,2.8,gz,1.6,2.6,1.6);
    shaft.material=new THREE.MeshLambertMaterial({color:0xd8e0c0,transparent:true,
      opacity:.10,emissive:new THREE.Color(0x3a4030),depthWrite:false});
    shaft.castShadow=false; shaft.renderOrder=-1; deco(shaft);
    var L=new THREE.PointLight(0xcfe0b0,.55,13,2); L.position.set(gx,3.2,gz); W.root.add(L);

    // three drips per grate, each on its own cycle, with a ripple where it lands
    for(var dq=0;dq<3;dq++)(function(k){
      var ox=rnd(-.7,.7), oz=rnd(-.7,.7), period=1.5+Math.random()*1.6, phase=Math.random()*period;
      var drop=cyl(0xbfe0d8,gx+ox,3.9,gz+oz,.035,.22);
      drop.material=new THREE.MeshLambertMaterial({color:0xbfe0d8,transparent:true,
        opacity:.75,emissive:new THREE.Color(0x2a4a44),depthWrite:false});
      drop.castShadow=false; drop.renderOrder=-1; deco(drop);
      var ring=new THREE.Mesh(new THREE.RingGeometry(.05,.16,14),
        new THREE.MeshBasicMaterial({color:0xbfe0d8,transparent:true,opacity:0,
          depthWrite:false,side:THREE.DoubleSide}));
      ring.rotation.x=-Math.PI/2; ring.position.set(gx+ox,.09,gz+oz);
      ring.renderOrder=-1; deco(ring);
      W.ticks.push(function(dt,t){
        var u=((t+phase)%period)/period;      // 0 at the grate, 1 at the floor
        var fall=u*u;                         // it accelerates, because gravity
        drop.position.y=3.9-fall*3.7;
        drop.visible=u<0.96;
        var r=(u-.86)/.14;                    // the splash, over the last of the fall
        if(r>0){ ring.material.opacity=.5*(1-r); ring.scale.setScalar(.4+r*1.9); }
        else ring.material.opacity=0;
        return false;
      });
    })(dq);
  });

  // find every wall face that looks onto a corridor, and hang things on some of them
  var faces=[];
  for(var fr=1;fr<N-1;fr++)for(var fc=1;fc<N-1;fc++){
    if(SEWER_MAP[fr][fc]!=='#')continue;
    if(SEWER_MAP[fr-1][fc]!=='#')faces.push([fc,fr,0,-1]);
    if(SEWER_MAP[fr+1][fc]!=='#')faces.push([fc,fr,0,1]);
    if(SEWER_MAP[fr][fc-1]!=='#')faces.push([fc,fr,-1,0]);
    if(SEWER_MAP[fr][fc+1]!=='#')faces.push([fc,fr,1,0]);
  }
  var propOrder=[1,0,4,2,5,3,7,6,9,8,1,5,2,7,0,4];
  var heights=[1.2,1.5,1.7,1.2,1.5,1.4,1.4,1.4,1.5,1.3];
  for(var fi=0;fi<propOrder.length&&faces.length;fi++){
    var F=faces[Math.floor(fi*faces.length/propOrder.length)];
    var idx=propOrder[fi];
    var px3=wx(F[0])+F[2]*(CELL/2+.06), pz3=wz(F[1])+F[3]*(CELL/2+.06);
    var ry=(F[2]!==0)?(F[2]>0?Math.PI/2:-Math.PI/2):(F[3]>0?0:Math.PI);
    var h3=heights[idx]*(idx===1?1:.95);
    wallArt(idx,px3,idx===9?1.3:2.3,pz3,ry,h3,SEWERDEC);
    if(idx===1){                                     // lanterns actually light the tunnel
      var LL=new THREE.PointLight(0xe8d88a,.75,10,2);
      LL.position.set(px3+F[2]*.5,2.5,pz3+F[3]*.5); W.root.add(LL);
    }
  }
  setSky(0x0e1414,0x0e1414,.035);
  addLights({hemi:0x6a8a80,ground:0x1a2220,hemiI:.5,sunI:.18,sunColor:0x9ad0c0,
    sunPos:[8,22,-8],target:[0,0,0],size:26});

  /* ---- it is a sewer, so it wants a roof over it, standing water, and things
     growing on it. all of this is scenery: none of it has a collider, and the
     ceiling is single sided so the camera can rise through it and still see in ---- */
  var ceil=new THREE.Mesh(new THREE.PlaneGeometry(N*CELL+8,N*CELL+8),
    new THREE.MeshLambertMaterial({color:0x3a3b36,side:THREE.FrontSide}));
  ceil.rotation.x=Math.PI/2; ceil.position.y=4.26; deco(ceil);

  var open=[];
  for(var orr=1;orr<N-1;orr++)for(var occ=1;occ<N-1;occ++)
    if(SEWER_MAP[orr][occ]!=='#')open.push([occ,orr]);

  function cellPick(i){ return open[(i*7919)%open.length]; }

  // standing water, gone green at the edges
  for(var pu=0;pu<26;pu++){
    var pc2=cellPick(pu), pxq=wx(pc2[0])+rnd(-1.3,1.3), pzq=wz(pc2[1])+rnd(-1.3,1.3);
    var pud=new THREE.Mesh(new THREE.CircleGeometry(rnd(.5,1.25),16),
      new THREE.MeshBasicMaterial({color:0x223330,transparent:true,opacity:.5,
        depthWrite:false,polygonOffset:true,polygonOffsetFactor:-3,polygonOffsetUnits:-3}));
    pud.rotation.x=-Math.PI/2; pud.position.set(pxq,.045,pzq); pud.renderOrder=0; deco(pud);
    var sheen=new THREE.Mesh(new THREE.CircleGeometry(rnd(.18,.5),12),
      new THREE.MeshBasicMaterial({color:0x6fa08c,transparent:true,opacity:.22,
        depthWrite:false}));
    sheen.rotation.x=-Math.PI/2; sheen.position.set(pxq+rnd(-.3,.3),.05,pzq+rnd(-.3,.3));
    sheen.renderOrder=1; deco(sheen);
  }
  // moss creeping out from the foot of the walls
  for(var mo=0;mo<34;mo++){
    var mc=cellPick(mo+53), mx=wx(mc[0])+rnd(-1.8,1.8), mz=wz(mc[1])+rnd(-1.8,1.8);
    var mos=new THREE.Mesh(new THREE.CircleGeometry(rnd(.3,.85),10),
      new THREE.MeshBasicMaterial({color:0x4d6b3f,transparent:true,opacity:.42,
        depthWrite:false}));
    mos.rotation.x=-Math.PI/2; mos.rotation.z=Math.random()*3;
    mos.position.set(mx,.042,mz); mos.renderOrder=0; deco(mos);
  }
  // chains, hanging where nobody has needed them for years
  for(var ch2=0;ch2<9;ch2++){
    var cc2=cellPick(ch2+211), cx2=wx(cc2[0])+rnd(-1.4,1.4), cz2=wz(cc2[1])+rnd(-1.4,1.4);
    var len=rnd(1.1,2.4);
    for(var li=0;li<Math.round(len*4);li++){
      var lk=cyl(0x585349,cx2,4.2-li*.25,cz2,.045,.2);

  /* ---- the locals. they live here, they are not interested in fighting anybody,

  function openAt(x,z){
    var c=Math.round(x/CELL+half), r=Math.round(z/CELL+half);
    if(r<1||c<1||r>=N-1||c>=N-1)return false;

  function critter(sheet,scale,hop,speed,seed){
    var st=open[(seed*4703)%open.length];
    var cx0=wx(st[0])+rnd(-1,1), cz0=wz(st[1])+rnd(-1,1);
    var g=makeCatSprite(0xffffff,scale,sheet);
    g.position.set(cx0,0,cz0); W.root.add(g);
    var yaw=Math.random()*6.28, tx=cx0, tz=cz0, wait=Math.random()*3, flee=0, bob=Math.random()*6;
    W.ticks.push(function(dt,t){
      var dxp=g.position.x-P.pos.x, dzp=g.position.z-P.pos.z;
      var dp=Math.sqrt(dxp*dxp+dzp*dzp);
      if(dp<2.4&&Math.abs(P.pos.y-g.position.y)<1.5)flee=Math.max(flee,1.1);
      var sp=speed, mx=0, mz=0;
      if(flee>0){
        flee-=dt; sp=speed*2.6;
        var l=dp||1; mx=dxp/l; mz=dzp/l;
      } else {
        wait-=dt;
        if(wait<=0){
          var a=Math.random()*6.28, d2=rnd(.8,2.4);
          var nx2=g.position.x+Math.sin(a)*d2, nz2=g.position.z+Math.cos(a)*d2;
          if(openAt(nx2,nz2)){ tx=nx2; tz=nz2; }
          wait=rnd(1.4,4.2);
          if(hop&&Math.random()<.35)AU.tone(rnd(180,260),rnd(120,170),.16,'triangle',.05);
        }
        var ddx=tx-g.position.x, ddz=tz-g.position.z, dd=Math.sqrt(ddx*ddx+ddz*ddz);
        if(dd>.12){ mx=ddx/dd; mz=ddz/dd; } 
      }
      if(mx||mz){
        var nxp=g.position.x+mx*sp*dt, nzp=g.position.z+mz*sp*dt;
        if(openAt(nxp,nzp)){ g.position.x=nxp; g.position.z=nzp; }
        else { wait=0; flee=0; }
        yaw=Math.atan2(mx,mz);
        bob+=dt*(hop?9:4);
      }
      // a frog hops, so it leaves the ground; a snake just pours along
      var lift=hop?Math.max(0,Math.sin(bob))*0.16*((mx||mz)?1:0)
                  :Math.abs(Math.sin(bob*.5))*0.01;
      updateCatSprite(g,yaw,{lift:lift,shadow:.8,
        squash:hop?(1+Math.sin(bob)*0.06):(1+Math.sin(bob*.6)*0.03)});
      return false;
    });
  }
  for(var fg=0;fg<8;fg++)critter(FROG,.34,true,1.5,fg+3);

  /* ---------------- the King ---------------- */

  deco(cyl(0x3a3a34,ex,2.2,ez+2.9,1.6,4.4));               // the pipe up and out,
  var pipeDark=cyl(0x0a0c0c,ex,2.2,ez+3.1,1.3,4.0);        // on the far side of the gate
  deco(pipeDark);
  var sky=cyl(0xe8b06a,ex,4.3,ez+2.9,1.1,.12);             // a circle of orange sky
  sky.material=M(0xe8b06a,{emissive:0x8a5a20}); deco(sky);

  /* ---- somebody has painted the way out on the floor. shortest path, throne to gate ---- */
  (function(){
    var key=function(c,r){return r*N+c;};
    var prev={}, seen={}, q=[[kingCell[0],kingCell[1]]];
    seen[key(kingCell[0],kingCell[1])]=1;
    while(q.length){
      var cur=q.shift();
      if(cur[0]===exitCell[0]&&cur[1]===exitCell[1])break;
      [[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){
        var nc=cur[0]+d[0], nr=cur[1]+d[1];
        if(nc<0||nr<0||nc>=N||nr>=N)return;
        if(SEWER_MAP[nr][nc]==='#')return;
        if(seen[key(nc,nr)])return;
        seen[key(nc,nr)]=1; prev[key(nc,nr)]=cur; q.push([nc,nr]);
      });
    }
    var path=[], p=[exitCell[0],exitCell[1]];
    while(p){ path.unshift(p); p=prev[key(p[0],p[1])]; }
    for(var i=0;i<path.length-1;i++){
      var a=path[i], b=path[i+1];
      var yaw=Math.atan2(wx(b[0])-wx(a[0]), wz(b[1])-wz(a[1]));
      floorArrow(wx(a[0]),wz(a[1]),yaw,1.6);
      floorArrow((wx(a[0])+wx(b[0]))/2,(wz(a[1])+wz(b[1]))/2,yaw,1.2);
    }
  })();

  /* ---------------- shinies ---------------- */
  var capGot=0;
  caps.forEach(function(cc,idx){
    var cxp=wx(cc[0]), czp=wz(cc[1]);
    var cap=new THREE.Group(); cap.position.set(cxp,.2,czp);

    cap.add(disc); cap.add(cyl(0xc4a03c,0,.05,0,.14,.03));

    var ci=inter(cxp,.3,czp,1.5,'Take the shiny thing',function(){

      floatText(cxp,1.2,czp,'SHINY ('+Math.min(capGot,3)+'/3)','#ffd166');

    },{uses:99});
  });

  function updateTask(){
    var f=GAME.flags;
    if(!f.metKing)      setTask('Find the middle of the maze. Something is living in it.');
    else if(capGot<3)   setTask('The King takes tribute: three shiny things. Found '+capGot+' of 3. There are four down here.');
    else if(!f.paid)    setTask('Take the three shinies back to the King.');
    else                setTask('Through the gate and up the pipe.');
  }

  inter(kx,.9,kz+1.4,2.8,'Bow to the Raccoon King',function(){
    if(!GAME.flags.metKing){
      GAME.flags.metKing=true; AU.chitter(); updateTask();
      say('The Raccoon King','“A house cat. In MY tunnels. Wearing a collar like it means something.”',5.4);
      queueSay([
        ['The Raccoon King','“The gate is mine. The gate opens for tribute. Three shiny things. Go on.”',5.6],

    W.ticks.push(function(dt){ gate.position.y+=dt*1.1; return gate.position.y>2.9; });

    queueSay([['Biscuits','The gate grinds up. Behind it, a pipe, and a circle of orange sky.',4.4]]);
    exitT.active=true;
  },{uses:99});
  var exitT=trigger(ex,ez+2.9,1.6,function(){ finishLevel(); },{active:false});

  }
  wreck(-9,-4,0,0xffffff,'carred'); wreck(9,3,Math.PI/2,0xffffff,'carblue');
  wreck(-2,14,.6,0xffffff,'rustbonnet');
  wreck(-17,-8,1.1,0xffffff,'carblue');  wreck(16,-14,.35,0xffffff,'carred');
  wreck(18,8,Math.PI/2,0xffffff,'rustbonnet'); wreck(-15,16,2.2,0xffffff,'carred');
  wreck(7,-17,.9,0xffffff,'carblue');    wreck(-19,4,1.6,0xffffff,'rustbonnet');
  // a stack of two, because somebody had a forklift and a sense of humour
  (function(){ var g=wreck(12,-3,.4,0xffffff,'carred');

  // tire stacks

  // one painted pile of junk, 3-4 things high, standing on a stepped collider:
  // a knee-high lower tier and the full-height top, so a cat gets up in two hops
  function junkStack(x,z,h,i){

  function junkWall(x0,x1,z,top){

function loadRigModel(url,M,done){
  if(!THREE.GLTFLoader){ M.failed=true; return; }
  fetch(url).then(function(r){ return r.json(); }).then(function(js){
    var raw=atob(js._bin), bin=new Uint8Array(raw.length);
    for(var i=0;i<raw.length;i++)bin[i]=raw.charCodeAt(i);
    delete js._bin; delete js._eyes;
    var jb=new TextEncoder().encode(JSON.stringify(js));
    var jl=(jb.length+3)&~3, bl=(bin.length+3)&~3, total=12+8+jl+8+bl;
    var buf=new ArrayBuffer(total), dv=new DataView(buf), u8=new Uint8Array(buf);
    dv.setUint32(0,0x46546C67,true); dv.setUint32(4,2,true); dv.setUint32(8,total,true);
    dv.setUint32(12,jl,true); dv.setUint32(16,0x4E4F534A,true);
    u8.fill(32,20,20+jl); u8.set(jb,20);
    dv.setUint32(20+jl,bl,true); dv.setUint32(24+jl,0x004E4942,true); u8.set(bin,28+jl);
    new THREE.GLTFLoader().parse(buf,'',function(g){
      M.gltf=g; M.ready=true;
      g.scene.traverse(function(o){ if(o.isMesh){ o.frustumCulled=false; o.castShadow=true;
        if(o.material&&o.material.map){ o.material.metalness=0; o.material.roughness=.9; M.mat=o.material; } } });
      if(done)done(g);
    },function(){ M.failed=true; });
  }).catch(function(){ M.failed=true; });
}

// one stray: its own skeleton, its own material (so it can flash and fade on its own)
function makeStrayModel(scale){ return makeRigEnemy(STRAYMODEL,.88*.93,scale,0xffffff,.36); }
function makeRaccModel(scale){ return makeRigEnemy(RACCMODEL,1.02*.93,scale,0xffffff,.5); }
function makeSkunkModel(scale,tint){ return makeRigEnemy(SKUNKMODEL,.95*.93,scale,tint||0xffffff,.42); }
function makeDogModel(scale,tint){ return makeRigEnemy(DOGMODEL,1.35*.93,scale,tint||0xffffff,.6); }
function makeRigEnemy(M,height,scale,tint,shr){
  var g=new THREE.Group();
  var m=THREE.SkeletonUtils?THREE.SkeletonUtils.clone(M.gltf.scene):M.gltf.scene;
  if(!M.h){ var box=new THREE.Box3().setFromObject(M.gltf.scene); M.h=box.max.y-box.min.y; }
  m.scale.setScalar(height*(scale||1)/M.h); g.add(m);
  var mats=[];
  m.traverse(function(o){ if(o.isMesh&&o.material){ o.material=o.material.clone(); o.material.transparent=true; mats.push(o.material); } });
  var sh=new THREE.Mesh(new THREE.CircleGeometry(shr*(scale||1),20),
    new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.28,depthWrite:false}));
  sh.rotation.x=-Math.PI/2; sh.position.y=.012; sh.scale.set(.6,1.4,1); g.add(sh);
  var mix=new THREE.AnimationMixer(m), acts={};
  M.gltf.animations.forEach(function(c){ acts[c.name]=mix.clipAction(c); });
  ['Attack','Hurt','Startle'].forEach(function(n){ if(acts[n]){ acts[n].setLoop(THREE.LoopOnce); acts[n].clampWhenFinished=true; } });
  g.userData={isModel:true,mix:mix,acts:acts,cur:null,model:m,mats:mats,tint:-1,base:tint};
  return g;
}
// the kings and the Baron: a model in 3D mode, the painted sprite otherwise
function makeFigure(sheet,M,height,tint,sprScale){
  if(USE3D&&M.ready){
    var g=makeRigEnemy(M,height,1,tint,.45*height);
    g.userData.head=g.userData.model.getObjectByName('head');
    return g;
  }

}
var _hv=new THREE.Vector3();
function driveFigure(g,yaw,clip,dt,opt){
  opt=opt||{};
  if(!g.userData.isModel){ updateCatSprite(g,yaw,opt); return; }
  var u=g.userData;
  g.rotation.y=yaw;
  playCat(u,clip,clip==='Attack'?.06:.2,1);
  u.mix.update(dt);
  var tint=opt.tint!==undefined&&opt.tint!==0xffffff?opt.tint:(u.base||0xffffff);
  if(u.tint!==tint){ for(var i=0;i<u.mats.length;i++)u.mats[i].color.setHex(tint); u.tint=tint; }
  var cr=opt.crown||u.crownObj;
  if(cr&&u.head){                                        // the crown rides on his head bone
    g.updateMatrixWorld(true); u.head.getWorldPosition(_hv); g.worldToLocal(_hv);
    cr.position.set(_hv.x,_hv.y+(opt.crownUp||u.crownUp||.3),_hv.z);
  }
}
function driveEnemyModel(e,clip,speed,dt,fade){
  var u=e.mesh.userData;
  e.mesh.position.set(e.x,0,e.z); e.mesh.rotation.y=e.yaw;
  playCat(u,clip,clip==='Attack'?.06:.2,speed||1);
  u.mix.update(dt);
  var tint=e.hurtT>0?0xff9a9a:(u.base||0xffffff);
  for(var i=0;i<u.mats.length;i++){
    if(u.tint!==tint)u.mats[i].color.setHex(tint);
    u.mats[i].opacity=fade===undefined?1:fade;
  }
  u.tint=tint;
}
function makeCatModel(){
  var g=new THREE.Group(), m=CATMODEL.gltf.scene;
  // the same model object is reused every level, so measure its height ONCE, unscaled;
  // re-measuring after it has been shrunk reset it to full size on every level start
  if(!CATMODEL.h){ m.scale.setScalar(1); var box=new THREE.Box3().setFromObject(m); CATMODEL.h=box.max.y-box.min.y; }
  m.scale.setScalar(.92*.93/CATMODEL.h); m.position.set(0,0,0);
  g.add(m);
  var sh=new THREE.Mesh(new THREE.CircleGeometry(.44,20),
    new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.28,depthWrite:false}));
  sh.rotation.x=-Math.PI/2; sh.position.y=.012; sh.scale.set(.75,1.25,1); g.add(sh);
  // eyelids: his eyes are painted on, so the model carries two fur-coloured lids
  // on its head bone; they close when he sleeps (and now and then, to blink)
  var lids=[]; m.traverse(function(o){ if(/^lid\d/.test(o.name)){ o.visible=false; lids.push(o); } });
  var mix=new THREE.AnimationMixer(m), acts={};
  CATMODEL.gltf.animations.forEach(function(c){ acts[c.name]=mix.clipAction(c); });
  ['Attack','Hurt','Startle','Yawn'].forEach(function(n){ if(acts[n]){ acts[n].setLoop(THREE.LoopOnce); acts[n].clampWhenFinished=true; } });
  g.userData={isModel:true,mix:mix,acts:acts,cur:null,model:m,shadow:sh,lids:lids,blinkT:3,blink:0};
  return g;
}
function makePlayerMesh(){
  if(P.mesh)scene.remove(P.mesh);
  if(USE3D&&CATMODEL.ready){
    P.mesh=makeCatModel(); P.parts=null;
  } else if(!SHEET.failed){                       // the painted turnaround, billboarded
    P.mesh=makeCatSprite(0xffffff,1); P.parts=null;
  } else {                                 // sheet did not load: fall back to the built model
    P.mesh=makeCat(); P.parts=P.mesh.userData; P.mesh.scale.setScalar(CAT_SCALE);
    P.mesh.traverse(function(o){ if(o.isMesh){o.castShadow=true;o.receiveShadow=true;} });
  }
  scene.add(P.mesh);
}

/* ============================ collision ============================ */
function overlaps(px,py,pz,c){
  return Math.abs(px-c.x)<PR+c.hx && Math.abs(py-c.y)<PH/2+c.hy && Math.abs(pz-c.z)<PR+c.hz;
}
/* Push out along whichever axis is LEAST penetrated. Resolving along the axis you
   happened to move on sends you clean through any wall longer than it is thick. */
/* shoving the furniture about: the whole point of being a cat */
function pushBlocked(x,z,r){
  for(var i=0;i<W.colliders.length;i++){
    var c=W.colliders[i];
    if(c.hy<.25)continue;                       // a doormat is not a wall
    if(Math.abs(x-c.x)<r+c.hx&&Math.abs(z-c.z)<r+c.hz)return true;
  }
  if(W.bounds&&!(W.bounds.until&&GAME.flags[W.bounds.until])){
    var B=W.bounds;
    if(x<B.x0+r||x>B.x1-r||z<B.z0+r||z>B.z1-r)return true;
  }
  return false;
}
function updatePushables(dt){
  if(!W.pushables)return;
  for(var i=0;i<W.pushables.length;i++){
    var o=W.pushables[i];
    if(Math.abs(P.pos.y-o.y)<.5){               // only things at his feet
      var dx=o.x-P.pos.x, dz=o.z-P.pos.z;
      var d=Math.sqrt(dx*dx+dz*dz);
      var need=PR+o.r;
      if(d<need){
        if(d<1e-4){ dx=Math.sin(P.yaw); dz=Math.cos(P.yaw); d=1; }
        var nx=dx/d, nz=dz/d, pen=need-d;
        o.x+=nx*pen; o.z+=nz*pen;               // never let him stand inside it
        o.vx+=nx*pen*11; o.vz+=nz*pen*11;
        var cap=Math.sqrt(o.vx*o.vx+o.vz*o.vz);   // a nudge, not a hockey puck
        if(cap>2.4){ o.vx*=2.4/cap; o.vz*=2.4/cap; }
        if(o.hit<=0&&P.speed>1.2){ o.hit=.45; AU.tone(120,80,.1,'triangle',.05); }
      }
    }
    o.hit=Math.max(0,o.hit-dt);
    var sp=Math.sqrt(o.vx*o.vx+o.vz*o.vz);
    if(sp>.01){
      var nx2=o.x+o.vx*dt, nz2=o.z+o.vz*dt;
      if(!pushBlocked(nx2,nz2,o.r)){ o.x=nx2; o.z=nz2; }
      else { o.vx*=-.2; o.vz*=-.2; }
      var f=Math.pow(.0004,dt);                 // it slides a little, it does not roll away
      o.vx*=f; o.vz*=f;
      if(sp<.05){ o.vx=0; o.vz=0; }
      o.mesh.position.x=o.x; o.mesh.position.z=o.z;
      o.st.x=o.x; o.st.z=o.z;
      o.mesh.rotation.z=Math.max(-.2,Math.min(.2,(o.vx*Math.cos(o.mesh.rotation.y)-
                                                  o.vz*Math.sin(o.mesh.rotation.y))*.07));
    } else if(o.mesh.rotation.z!==0){
      o.mesh.rotation.z*=Math.pow(.02,dt);
      if(Math.abs(o.mesh.rotation.z)<.002)o.mesh.rotation.z=0;
    }
  }
}
function resolveHorizontal(){
  var cy=P.pos.y+PH/2;
  for(var pass=0;pass<3;pass++){
    var hit=false;
    for(var i=0;i<W.colliders.length;i++){
      var c=W.colliders[i];
      var ov=(PH/2+c.hy)-Math.abs(cy-c.y);
      if(ov<=.02)continue;      // standing on a sill lands exactly on this boundary:
                                // without the slack it flickers solid and flings you off
      var dx=P.pos.x-c.x, dz=P.pos.z-c.z;
      var px=PR+c.hx-Math.abs(dx), pz=PR+c.hz-Math.abs(dz);
      if(px<=0||pz<=0)continue;
      hit=true;
      if(px<pz){ P.pos.x+=(dx>=0?px:-px); P.vel.x=0; }
      else     { P.pos.z+=(dz>=0?pz:-pz); P.vel.z=0; }
    }
    if(!hit)break;
  }
}
function resolveY(prevY){
  var landed=false;
  for(var i=0;i<W.colliders.length;i++){
    var c=W.colliders[i];
    if(Math.abs(P.pos.x-c.x)>=PR+c.hx)continue;
    if(Math.abs(P.pos.z-c.z)>=PR+c.hz)continue;
    var top=c.y+c.hy, bot=c.y-c.hy;
    if(P.pos.y>=top||P.pos.y+PH<=bot)continue;
    if(P.vel.y<=0&&prevY>=top-.04){ P.pos.y=top; P.vel.y=0; landed=true; }
    else if(P.vel.y>0&&prevY+PH<=bot+.04){ P.pos.y=bot-PH; P.vel.y=-.5; }
  }
  if(P.pos.y<=0){ P.pos.y=0; if(P.vel.y<0)P.vel.y=0; landed=true; }
  if(landed&&!P.grounded&&P.vel.y<=0)AU.land();
  P.grounded=landed;
}
function camBlocked(x,y,z,m){
  for(var i=0;i<W.colliders.length;i++){
    var c=W.colliders[i];
    if(c.hy<1.2||c.noCam)continue;        // only real walls shove the camera; furniture never does
    if(Math.abs(x-c.x)<c.hx+m&&Math.abs(y-c.y)<c.hy+m&&Math.abs(z-c.z)<c.hz+m)return true;
  }
  return false;
}
function groundBelow(x,z,y){
  var best=0;
  for(var i=0;i<W.colliders.length;i++){
    var c=W.colliders[i];
    if(Math.abs(x-c.x)>=PR+c.hx)continue;
    if(Math.abs(z-c.z)>=PR+c.hz)continue;
    var top=c.y+c.hy;
    if(top<=y+.05&&top>best)best=top;
  }
  return best;
}
function circlePush(o,r){
  for(var i=0;i<W.colliders.length;i++){
    var c=W.colliders[i];
    if(c.y-c.hy>o.y+1.2)continue;
    var dx=o.x-c.x, dz=o.z-c.z;
    var ox=r+c.hx-Math.abs(dx), oz=r+c.hz-Math.abs(dz);
    if(ox>0&&oz>0){
      if(ox<oz)o.x+=(dx>0?ox:-ox); else o.z+=(dz>0?oz:-oz);
    }
  }
}

/* ============================ input ============================ */
var K={};
var touchVec={x:0,y:0};
var pressed={jump:false,claw:false,act:false,meow:false};
function onKey(e,down){
  var k=e.key.toLowerCase();
  if(down&&!K[k]){
    if(k===' '||k==='w'&&false){}
    if(k===' ')pressed.jump=true;
    if(k==='j'||k==='f'||k==='e')pressed.act=true;   // one button: swipe if there is
                                                     // something to swipe, else use it
    if(k==='q')pressed.meow=true;
    if(k==='m')toggleMute();
    if(k==='escape'||k==='p')togglePause();
  }
  K[k]=down;
  if([' ','arrowup','arrowdown','arrowleft','arrowright'].indexOf(k)>=0)e.preventDefault();
}
window.addEventListener('keydown',function(e){onKey(e,true);});
window.addEventListener('keyup',function(e){onKey(e,false);});

/* ---- game controller. every button just presses the key it stands for, so the
   controller goes through exactly the same doors as the keyboard ----
   left stick move / right stick camera / A jump / X or B swipe & use / Y meow
   RT or R3 sprint / LT stalk / Start pause / Back mute / A on a card presses its button */
var GPAD=window.GPAD={x:0,y:0,on:false};
(function(){
  var MAP={0:' ',1:'e',2:'e',3:'q',9:'escape',8:'m',7:'shift',11:'shift',6:'control',
           12:'arrowup',13:'arrowdown',14:'arrowleft',15:'arrowright'};
  var held={}, last=performance.now();
  function dz(v){ var a=Math.abs(v); return a<.18?0:Math.sign(v)*(a-.18)/.82; }
  function fire(k,down){
    window.dispatchEvent(new KeyboardEvent(down?'keydown':'keyup',{key:k===' '?' ':k,bubbles:true,cancelable:true}));
  }
  function cardButton(){
    if(document.querySelector('video'))return null;             // the intro is playing: A skips it
    if(!overlay||!overlay.classList.contains('on'))return null;
    var b=cardEl.querySelector('.btn'); return b&&b.offsetParent?b:null;
  }
  function poll(){
    var now=performance.now(), dt=Math.min(.05,(now-last)/1000); last=now;
    var pads=navigator.getGamepads?navigator.getGamepads():[], g=null;
    for(var i=0;i<pads.length;i++)if(pads[i]&&pads[i].connected){ g=pads[i]; break; }
    if(!g){ GPAD.x=GPAD.y=0; return; }
    if(!GPAD.on){ GPAD.on=true; AU.init(); }
    GPAD.x=dz(g.axes[0]||0); GPAD.y=dz(g.axes[1]||0);
    var rx=dz(g.axes[2]||0), ry=dz(g.axes[3]||0);
    if(GAME.state==='play'&&(rx||ry)){
      CAM.yaw-=rx*2.8*dt;
      CAM.pitch=clamp(CAM.pitch+ry*1.6*dt,.1,1.25);
    }
    for(var b=0;b<g.buttons.length;b++){
      var k=MAP[b]; if(!k)continue;
      var bt=g.buttons[b], on=bt.pressed||bt.value>.5;
      if(on===!!held[b])continue;
      held[b]=on;
      if(on&&b===0){ var cb=cardButton(); if(cb){ AU.init(); cb.click(); continue; } }
      fire(k,on);
    }
  }
  addEventListener('gamepadconnected',function(){ if(typeof say==='function'&&GAME.state==='play')
    say('Biscuits','Controller connected. Left stick to prowl, A to jump, X to swipe.',3.6); });
  setInterval(poll,16);
})();

/* touch */
var isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
if(isTouch)document.body.classList.add('touch');
(function(){
  var stick=$('stick'),knob=$('knob'),sid=null,cx=0,cy=0;
  function start(e){ AU.init(); var t=e.changedTouches?e.changedTouches[0]:e; sid=t.identifier===undefined?'m':t.identifier;
    var r=stick.getBoundingClientRect(); cx=r.left+r.width/2; cy=r.top+r.height/2; move(e); }
  function move(e){
    var list=e.changedTouches||[e],t=null;
    for(var i=0;i<list.length;i++){ if((list[i].identifier===undefined?'m':list[i].identifier)===sid)t=list[i]; }
    if(!t)return;
    var dx=t.clientX-cx, dy=t.clientY-cy, d=Math.sqrt(dx*dx+dy*dy), m=52;
    if(d>m){dx*=m/d;dy*=m/d;d=m;}
    knob.style.transform='translate('+dx+'px,'+dy+'px)';
    touchVec.x=dx/m; touchVec.y=dy/m;
  }
  function end(){ sid=null; touchVec.x=0; touchVec.y=0; knob.style.transform=''; }
  stick.addEventListener('touchstart',function(e){start(e);e.preventDefault();},{passive:false});
  stick.addEventListener('touchmove',function(e){move(e);e.preventDefault();},{passive:false});
  stick.addEventListener('touchend',end); stick.addEventListener('touchcancel',end);
  function btn(id,key){
    var el=$(id); if(!el)return;
    el.addEventListener('touchstart',function(e){AU.init();pressed[key]=true;e.preventDefault();},{passive:false});
    el.addEventListener('mousedown',function(e){AU.init();pressed[key]=true;e.preventDefault();});
  }
  btn('tbJump','jump'); btn('tbClaw','act'); btn('tbInteract','act'); btn('tbMeow','meow');
  // camera swipe on the right half of the screen
  var camId=null,lx=0,ly=0;
  cv.addEventListener('touchstart',function(e){
    AU.init(); var t=e.changedTouches[0]; camId=t.identifier; lx=t.clientX; ly=t.clientY;
  },{passive:true});
  cv.addEventListener('touchmove',function(e){
    for(var i=0;i<e.changedTouches.length;i++){
      var t=e.changedTouches[i]; if(t.identifier!==camId)continue;
      CAM.yaw-=(t.clientX-lx)*.008;
      CAM.pitch=clamp(CAM.pitch+(t.clientY-ly)*.005,.1,1.25);
      lx=t.clientX; ly=t.clientY;
    }
  },{passive:true});
  cv.addEventListener('touchend',function(){camId=null;});
})();

/* ============================ effects ============================ */
function shake(a){ if(!window.matchMedia||!window.matchMedia('(prefers-reduced-motion: reduce)').matches)CAM.shake=Math.min(CAM.shake+a,1.2); }
function puff(x,y,z,color,n){
  for(var i=0;i<(n||6);i++){
    var p=sph(color,x,y,z,.07,.07,.07,true); p.castShadow=false; W.root.add(p);
    (function(p){
      var v=V(rnd(-2,2),rnd(1.2,3.6),rnd(-2,2)), life=0;
      W.ticks.push(function(dt){
        life+=dt; v.y-=14*dt;
        p.position.x+=v.x*dt; p.position.y+=v.y*dt; p.position.z+=v.z*dt;
        p.scale.multiplyScalar(1-dt*1.8);
        if(life>.7){ W.root.remove(p); return true; }
        return false;
      });
    })(p);
  }
}
var floatPool=$('floaters');
function floatText(x,y,z,txt,color){
  var v=V(x,y,z).project(camera);
  if(v.z>1)return;
  var el=document.createElement('div');
  el.className='float'; el.textContent=txt; el.style.color=color||'#f7efe2';
  el.style.left=((v.x*.5+.5)*window.innerWidth)+'px';
  el.style.top=((-v.y*.5+.5)*window.innerHeight)+'px';
  floatPool.appendChild(el);
  setTimeout(function(){ if(el.parentNode)el.parentNode.removeChild(el); },1050);
}

function spawnEnemy(type,x,z,opt){
  opt=opt||{};
  var T=ETYPE[type];
