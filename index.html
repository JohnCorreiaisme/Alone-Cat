       :(USE3D&&type==='raccoon'&&RACCMODEL.ready)?makeRaccModel(opt.scale)
       :(USE3D&&type==='skunk'&&SKUNKMODEL.ready)?makeSkunkModel(opt.scale)
       :(USE3D&&(type==='dog'||type==='alpha')&&DOGMODEL.ready)?makeDogModel(opt.scale,type==='alpha'?0x8a7a70:0xffffff)
       :(T.sprite?makeCatSprite(T.tint||0xffffff,opt.scale||1,T.sprite()):T.make());
  if(!T.sprite&&!m.userData.isModel)m.scale.setScalar(opt.scale||1);
  m.position.set(x,0,z); W.root.add(m);
  var e={type:type,T:T,mesh:m,x:x,y:0,z:z,vx:0,vz:0,hp:T.hp*(opt.hpMul||1),maxhp:T.hp*(opt.hpMul||1),
    r:T.r*(opt.scale||1),aggro:opt.aggro||T.aggro,state:'idle',t:Math.random()*4,atkCd:1,
    hurtT:0,dead:false,sleep:!!opt.sleep,name:opt.name||T.label,patrol:opt.patrol||null,pi:0,yaw:0,
    leash:opt.leash||T.leash||0,warnT:0,
    lunge:0,sfxT:rnd(2,6),onDeath:null,home:{x:x,z:z}};
  W.enemies.push(e); return e;
}
function hazard(x,y,z,r,life,dps){
  var cloud=new THREE.Group(); cloud.position.set(x,y,z); W.root.add(cloud);
  for(var i=0;i<7;i++){
    var s=sph(0x9ad9b4,rnd(-r*.5,r*.5),rnd(0,r*.6),rnd(-r*.5,r*.5),r*.45,r*.45,r*.45,true);
    s.material=new THREE.MeshLambertMaterial({color:0x9ad9b4,transparent:true,opacity:.42,flatShading:true});
    s.castShadow=false; cloud.add(s);
  }
  var h={x:x,y:y,z:z,r:r,t:0,life:life,dps:dps,mesh:cloud};
  W.hazards.push(h); return h;
}
function updateEnemies(dt){
  for(var i=W.enemies.length-1;i>=0;i--){
    var e=W.enemies[i];
    e.t+=dt; e.atkCd-=dt; e.hurtT=Math.max(0,e.hurtT-dt);
    if(e.flee!==undefined){                 // had enough: turns tail and bolts
      e.flee+=dt;
      var fx2=e.x-P.pos.x, fz2=e.z-P.pos.z, fd2=Math.sqrt(fx2*fx2+fz2*fz2)||.001;
      e.vx=fx2/fd2*e.T.speed*1.9; e.vz=fz2/fd2*e.T.speed*1.9;
      e.x+=e.vx*dt; e.z+=e.vz*dt; circlePush(e,e.r);
      e.yaw=Math.atan2(e.vx,e.vz);
      var fade=Math.max(0,1-Math.max(0,e.flee-1.5)/1.0);
      if(e.mesh.userData.isModel){
        driveEnemyModel(e,'Run',1.3,dt,fade);
      } else if(e.mesh.userData.isSprite){
        e.mesh.position.set(e.x,0,e.z);
        var fsh=e.mesh.userData.sheet, FM=(fsh&&fsh.act&&fsh.act.map)||null;
        updateCatSprite(e.mesh,e.yaw,{
          act:FM?(e.flee<.55?FM.cower:FM.flee):((fsh&&fsh.act)?4:-1),
          lift:Math.abs(Math.sin(e.flee*20))*.1,shadow:fade});
        e.mesh.userData.mat.uniforms.uFade.value=fade;
      } else {
        e.mesh.position.set(e.x,e.mesh.position.y,e.z);
        e.mesh.rotation.y=e.yaw;
      }
      if(e.flee>2.6){ W.root.remove(e.mesh); W.enemies.splice(i,1); }
      continue;
    }
    var dx=P.pos.x-e.x, dz=P.pos.z-e.z, d=Math.sqrt(dx*dx+dz*dz)||.001;
    var sp=0;
    if(e.sleep||!P.ctrl||P.dead){
      e.vx=e.vz=0;
      if(e.sleep){ e.mesh.position.y=Math.sin(e.t*1.4)*.03; }
    } else if(d<e.aggro&&(!e.leash||Math.sqrt(Math.pow(e.x-e.home.x,2)+Math.pow(e.z-e.home.z,2))<e.leash)){
      if(e.state!=='chase'){
        e.state='chase'; if(AU[e.T.sfx])AU[e.T.sfx]();
        e.warnT=e.T.warn||0;                       // squares up first, does not just charge
      }
      if(e.warnT>0){
        e.warnT-=dt; e.vx=e.vz=0; sp=0;
        e.yaw=Math.atan2(dx/d,dz/d);
      } else {
      var want=e.T.ranged?e.T.keep:0;
      var dir=(d>want+.6)?1:(d<want-.6?-1:0);
      if(e.T.ranged&&dir===0){ e.vx=-dz/d*e.T.speed*.6; e.vz=dx/d*e.T.speed*.6; }
      else { e.vx=dx/d*e.T.speed*dir; e.vz=dz/d*e.T.speed*dir; }
      sp=e.T.speed;
      }
      // attacks
      if(e.T.ranged){
        if(e.atkCd<=0&&d<9){
          e.atkCd=3.0; AU.spray();
          hazard(e.x-dx/d*1.2,.5,e.z-dz/d*1.2,2.6,3.2,2.2);
          floatText(e.x,1.6,e.z,'PFFFT','#9ad9b4');
        }
      } else if(d<e.T.range+e.r&&e.atkCd<=0){
        e.atkCd=e.T.cd; e.lunge=.28;
        if(AU[e.T.sfx])AU[e.T.sfx]();
        damagePlayer(e.T.dmg,dx/d,dz/d,e.T.knock);
      }
    } else if(e.leash&&Math.sqrt(Math.pow(e.x-e.home.x,2)+Math.pow(e.z-e.home.z,2))>1.2&&!e.sleep){
      var hx2=e.home.x-e.x, hz2=e.home.z-e.z, hd2=Math.sqrt(hx2*hx2+hz2*hz2);
      e.vx=hx2/hd2*e.T.speed*.7; e.vz=hz2/hd2*e.T.speed*.7; sp=e.T.speed*.7;
      e.state='home';
    } else {
      e.state='idle'; e.warnT=0;
      if(e.patrol){
        var tg=e.patrol[e.pi];
        var px=tg[0]-e.x, pz=tg[1]-e.z, pd=Math.sqrt(px*px+pz*pz);
        if(pd<.8){ e.pi=(e.pi+1)%e.patrol.length; }
        else { e.vx=px/pd*1.4; e.vz=pz/pd*1.4; sp=1.4; }
      } else { e.vx*=.86; e.vz*=.86; }
    }
    if(e.lunge>0){ e.lunge-=dt; e.vx*=1.9; e.vz*=1.9; }
    e.x+=e.vx*dt; e.z+=e.vz*dt;
    circlePush(e,e.r);
    // separate from each other
    for(var j=0;j<W.enemies.length;j++){
      if(j===i)continue; var o=W.enemies[j]; if(o.flee!==undefined)continue;
      var ox=e.x-o.x, oz=e.z-o.z, od=Math.sqrt(ox*ox+oz*oz)||.001, min=e.r+o.r;
      if(od<min){ e.x+=ox/od*(min-od)*.5; e.z+=oz/od*(min-od)*.5; }
    }
    if(e.vx||e.vz){
      var ty=Math.atan2(e.vx,e.vz);
      var diff=((ty-e.yaw+Math.PI*3)%(Math.PI*2))-Math.PI;
      e.yaw+=diff*Math.min(1,dt*9);
    }
    var ph=e.t*Math.max(2.5,sp*3.4);
    if(e.mesh.userData.isModel){
      var eclip='Idle', esp=1;
      if(e.sleep)eclip=(e.type==='stray'?'Sleep':'Loaf');
      else if(e.hurtT>0)eclip='Hurt';
      else if(e.lunge>0)eclip='Attack';
      else if(e.warnT>0)eclip='Hiss';
      else if(e.state==='chase'&&d<e.T.range+e.r+.8)eclip='Hiss';
      else if(sp>2.6){ eclip='Run'; esp=sp/4.2; }
      else if(sp>.05){ eclip='Walk'; esp=Math.max(.6,sp/1.6); }
      else if(e.state!=='chase')eclip=(Math.sin(e.t*.4)>.3?'Groom':'Sit');
      driveEnemyModel(e,eclip,esp,dt);
    } else if(e.mesh.userData.isSprite){
      var actI=-1, ash=e.mesh.userData.sheet;
      if(ash&&ash.act){
        var AM=ash.act.map||{hurt:5,atkA:3,atkB:4,warn:1,near:2,idleA:6,idleB:7,cower:5};
        if(e.hurtT>0)actI=AM.hurt;
        else if(e.lunge>0)actI=(e.t%2<1?AM.atkA:AM.atkB);
        else if(e.warnT>0)actI=AM.warn;
        else if(e.state==='chase'&&d<e.T.range+e.r+.8)actI=AM.near;
        else if(sp<.05&&e.state!=='chase')actI=(Math.sin(e.t*.4)>.3?AM.idleA:AM.idleB);
      }
      e.mesh.position.set(e.x,0,e.z);
      updateCatSprite(e.mesh,e.yaw,{
        act:actI,
        lift:sp?Math.abs(Math.sin(ph))*.06:0,
        squash:1+(e.lunge>0?.12:0),
        tint:e.hurtT>0?0xff9a9a:0xffffff, shadow:1});
    } else {
      e.mesh.position.set(e.x,e.mesh.position.y,e.z);
      e.mesh.rotation.y=e.yaw;
      var u=e.mesh.userData;
      if(u&&u.legs){
        for(var L=0;L<u.legs.length;L++)u.legs[L].rotation.x=Math.sin(ph+(L%2?Math.PI:0))*(sp?.55:.05);
        if(u.body)u.body.position.y=Math.abs(Math.sin(ph))*(sp?.07:.01)+(e.hurtT>0?rnd(-.05,.05):0);
      }
      e.mesh.scale.setScalar((e.baseScale||(e.baseScale=e.mesh.scale.x))*(e.hurtT>0?1.12:1));
    }
  }
  // hazards
  for(var h=W.hazards.length-1;h>=0;h--){
    var hz=W.hazards[h]; hz.t+=dt;
    hz.mesh.scale.setScalar(1+hz.t*.4);
    hz.mesh.children.forEach(function(c){ c.material.opacity=Math.max(0,.42*(1-hz.t/hz.life)); });
    var hd=Math.sqrt(Math.pow(P.pos.x-hz.x,2)+Math.pow(P.pos.z-hz.z,2));
    if(hd<hz.r&&P.pos.y<1.6){
      P.stink=1.6;
      P.hp-=hz.dps*dt;
      if(P.hp<=0&&!P.dead)die('The skunk wins. The skunk always wins.');
    }
    if(hz.t>hz.life){ W.root.remove(hz.mesh); W.hazards.splice(h,1); }
  }
}
function hurtEnemy(e,n,fx,fz){
  if(e.flee!==undefined)return;
  e.hp-=n; e.hurtT=.18; AU.hit();
  e.x+=fx*.55; e.z+=fz*.55;
  puff(e.x,1,e.z,0xf7efe2,5);
  floatText(e.x,1.7,e.z,'!',"#ffc06b");
  if(e.hp<=0){
    e.flee=0; e.sleep=true;
    floatText(e.x,1.8,e.z,'RUNS OFF!','#7fd6b0');
    if(e.onDeath)e.onDeath();
  }
}
function enemyInRange(){
  var best=null,bd=1e9;
  for(var i=0;i<W.enemies.length;i++){
    var e=W.enemies[i];
    if(e.flee!==undefined||e.sleep)continue;
    if(Math.abs(e.y-P.pos.y)>1.8)continue;
    var d=Math.hypot(e.x-P.pos.x,e.z-P.pos.z)-e.r;
    if(d<1.9&&d<bd){bd=d;best=e;}
  }
  return best;
}
function playerAttack(){
  if(P.atkCd>0||!P.ctrl||P.dead)return;
  P.atkCd=.46; P.atkT=.26; AU.scratch();
  P.hunger=clamp(P.hunger-.15,0,100);
  var hitAny=false;
  W.enemies.forEach(function(e){        // a swipe lands all round him: the sprite
    if(e.flee!==undefined)return;       // always faces you, so aiming was invisible
    var dx=e.x-P.pos.x, dz=e.z-P.pos.z, d=Math.sqrt(dx*dx+dz*dz)||.001;
    if(d>1.9+e.r)return;
    hitAny=true;
    P.yaw=Math.atan2(dx/d,dz/d);
    hurtEnemy(e,1,dx/d,dz/d);
  });
  if(hitAny)shake(.35);
}
function damagePlayer(n,dx,dz,knock){
  if(P.hurtT>0||P.dead||!P.ctrl)return;
  P.hp-=n; P.hurtT=1.0;
  P.vel.x=-(dx||0)*(knock||5); P.vel.z=-(dz||0)*(knock||5); P.vel.y=3.2;
  AU.hurt(); shake(.8); flashScreen();
  floatText(P.pos.x,1.6,P.pos.z,'-'+n,'#e0565c');
  if(P.hp<=0)die('Nine lives is a rumour. You had about four.');
}

/* ============================ player update ============================ */
function updatePlayer(dt){
  var mx=0,mz=0;
  if(P.ctrl&&!P.dead&&GAME.state==='play'){
    if(K['w']||K['arrowup'])mz+=1;
    if(K['s']||K['arrowdown'])mz-=1;
    if(K['a']||K['arrowleft'])mx-=1;
    if(K['d']||K['arrowright'])mx+=1;
    mx+=touchVec.x+GPAD.x; mz-=touchVec.y+GPAD.y;
  }
  var mag=Math.sqrt(mx*mx+mz*mz);
  if(mag>1){mx/=mag;mz/=mag;mag=1;}
  var fx=-Math.sin(CAM.yaw), fz=-Math.cos(CAM.yaw);
  var rx=-fz, rz=fx;
  var dx=fx*mz+rx*mx, dz=fz*mz+rz*mx;

  var starving=P.hunger<=14;
  var tmag=Math.sqrt(touchVec.x*touchVec.x+touchVec.y*touchVec.y);
  P.stalk=(K['control']||K['c']||(tmag>.05&&tmag<.55))&&mag>.03;
  P.sprint=K['shift']&&!P.stalk&&mag>.1&&P.hunger>6;
  var base=3.6*(P.sprint?1.5:1)*(P.stalk?.42:1)*(starving?.72:1)*((P.sickT>0)?.78:1);
  P.speed=mag*base;

  if(mag>.05){
    P.vel.x=lerp(P.vel.x,dx*base,Math.min(1,dt*(P.grounded?16:9)));
    P.vel.z=lerp(P.vel.z,dz*base,Math.min(1,dt*(P.grounded?16:9)));
    var ty=Math.atan2(dx,dz);
    var diff=((ty-P.yaw+Math.PI*3)%(Math.PI*2))-Math.PI;
    P.yaw+=diff*Math.min(1,dt*12);
  } else {
    P.vel.x*=Math.pow(.0025,dt); P.vel.z*=Math.pow(.0025,dt);
  }

  if(pressed.jump){ pressed.jump=false; P.jumpBuf=.16; }          // pressed a little early? still counts
  P.jumpBuf=Math.max(0,(P.jumpBuf||0)-dt);
  P.coyote=P.grounded?.12:Math.max(0,(P.coyote||0)-dt);            // stepped off a ledge? still counts
  if(P.jumpBuf>0&&P.coyote>0&&P.ctrl&&!P.dead&&GAME.state==='play'){
    P.vel.y=JUMPV; P.grounded=false; P.coyote=0; P.jumpBuf=0;
    AU.jump(); P.hunger=clamp(P.hunger-.05,0,100);
  }
  if(pressed.meow){ pressed.meow=false; AU.meow(); P.meowT=.5;
    W.enemies.forEach(function(e){ if(e.sleep&&Math.hypot(e.x-P.pos.x,e.z-P.pos.z)<9)e.sleep=false; }); }

  var prevY=P.pos.y;
  var sx=P.vel.x*dt, sz=P.vel.z*dt;
  var steps=Math.max(1,Math.ceil(Math.sqrt(sx*sx+sz*sz)/(PR*.5)));
  for(var st=0;st<steps;st++){ P.pos.x+=sx/steps; P.pos.z+=sz/steps; resolveHorizontal(); }
  P.vel.y+=GRAV*(P.vel.y<0?1.35:1)*dt;   // drop faster than you rise: landings read cleanly
  P.pos.y+=P.vel.y*dt; resolveY(prevY);
  resolveHorizontal();
  if(W.bounds&&!(W.bounds.until&&GAME.flags[W.bounds.until])){
    var B=W.bounds;                       // squeezed through a wall? you are still in the room
    if(P.pos.x<B.x0){P.pos.x=B.x0;P.vel.x=0;}
    if(P.pos.x>B.x1){P.pos.x=B.x1;P.vel.x=0;}
    if(P.pos.z<B.z0){P.pos.z=B.z0;P.vel.z=0;}
    if(P.pos.z>B.z1){P.pos.z=B.z1;P.vel.z=0;}
  }

  if(mag>.25&&P.grounded&&P.ctrl&&!P.dead){
    var moved=Math.abs(P.pos.x-(P.lastX===undefined?P.pos.x:P.lastX))
             +Math.abs(P.pos.z-(P.lastZ===undefined?P.pos.z:P.lastZ));
    if(moved<dt*.35)P.stuckT=(P.stuckT||0)+dt; else P.stuckT=0;
    if(P.stuckT>1.1){                       // wedged: a small hop frees it
      P.stuckT=0; P.pos.y+=.12; P.vel.y=JUMPV*.55;
      P.vel.x-=Math.sin(P.yaw)*1.6; P.vel.z-=Math.cos(P.yaw)*1.6;
      AU.jump();
    }
  } else P.stuckT=0;
  P.lastX=P.pos.x; P.lastZ=P.pos.z;

  if(P.pos.y<-6&&W.spawn){                 // fell out of the world: put him back on the ledge
    P.pos.copy(W.spawn); P.vel.set(0,0,0); AU.meow();
    say('Biscuits','You misjudge a gap. You land on your feet, of course, but you do have to walk back.',4.2);
  }
  P.atkT=Math.max(0,P.atkT-dt); P.atkCd=Math.max(0,P.atkCd-dt);
  P.hurtT=Math.max(0,P.hurtT-dt); P.stink=Math.max(0,P.stink-dt);
  if(P.meowT)P.meowT=Math.max(0,P.meowT-dt);
  if(P.sickT>0){
    P.sickT-=dt; P.hp-=.10*dt;
    if(P.hp<=0)die('Too much toilet water. An undignified way to go, frankly.');
  }

  // hunger
  if(GAME.state==='play'&&P.ctrl&&!P.dead){
    var drain=.045+(P.sprint?.15:0)+(GAME.level>0?.015:0);
    P.hunger=clamp(P.hunger-drain*dt,0,100);
    if(P.hunger<=0){
      P.hp-=.25*dt;
      if(P.hp<=0)die('Your tummy wins. It was always going to win.');
    } else if(P.hunger>64&&P.hp<P.maxhp){
      P.hp=Math.min(P.maxhp,P.hp+.3*dt);
    }
  }
  if(P.speed>.4||!P.grounded||P.atkT>0||P.hurtT>0||P.dead){ P.idleT=0; P.zT=0; }
  else P.idleT=(P.idleT||0)+dt;
  // loafed at 15s, asleep a few seconds after that
  if(P.idleT>18&&GAME.state==='play'&&!P.dead){
    P.zT=(P.zT||0)+dt;
    if(P.zT>.42){
      P.zT=0; P.zN=(P.zN||0)+1;
      var k=P.zN%6;                                        // Z Z z z z z, over and over
      spawnZ(P.pos.x+.2,P.pos.y+.78,P.pos.z,
             [.62,.56,.46,.42,.38,.36][k], k<2?'Z':'z');
      if(k===0)AU.tone(190,150,.55,'sine',.035);           // a very small snore
    }
  } else if(P.idleT<=18)P.zT=0;
  animateCat(dt);
}

function playCat(u,name,fade,speed){
  var a=u.acts[name]; if(!a)return;
  a.timeScale=speed||1;
  if(u.cur===name)return;
  var prev=u.cur&&u.acts[u.cur];
  a.reset().play();
  if(prev)prev.crossFadeTo(a,fade||.18,false);
  u.cur=name;
}
function animateCat(dt){
  if(P.mesh&&P.mesh.userData.isModel){
    var u=P.mesh.userData;
    P.mesh.position.set(P.pos.x,P.pos.y,P.pos.z);
    P.mesh.rotation.y=P.yaw;
    u.shadow.position.y=groundBelow(P.pos.x,P.pos.z,P.pos.y)-P.pos.y+.012;
    // same moods as the painted cat: status first, then moving, then the idle routine
    var clip='Idle', sp=1;
    var IDLECLIP=['Sit','Groom','Groom','Groom','Drowsy','Yawn','Drowsy','Sleep'];
    if(GAME.state==='pause')clip='Sleep';
    else if(P.dead)clip='Flop';
    else if(P.hurtT>.72)clip='Startle';
    else if(P.hurtT>.4)clip='Hurt';
    else if(P.atkT>0)clip='Attack';
    else if(!P.grounded)clip='Jump';
    else if(P.speed>4.4){ clip='Run'; sp=P.speed/5.4; }
    else if(P.speed>.4){ clip=(P.sickT>0||P.stink>0||P.hunger<=6)?'Dizzy':'Walk'; sp=Math.max(.5,P.speed/2.4); }
    else if(P.stink>0||P.hunger<=6)clip='Dizzy';
    else if(P.sickT>0)clip='Sick';
    else if(P.idleT>2.0){
      var fi=idleFrameAt(P.idleT-2.0);
      clip=IDLECLIP[fi];
      if(fi!==P.lastIdle){
        if(fi===5)AU.tone(300,220,.5,'sine',.07);          // the yawn
        if(fi===7)AU.purr();
        P.lastIdle=fi;
      }
    } else P.lastIdle=-1;
    playCat(u,clip,clip==='Attack'?.06:.2,sp);
    u.mix.update(dt);
    // eyes shut asleep, and a blink every few seconds otherwise
    u.blinkT-=dt; if(u.blinkT<=0){ u.blink=.13; u.blinkT=rnd(2.5,6); }
    if(u.blink>0)u.blink-=dt;
    var shut=clip==='Sleep'||clip==='Loaf'||clip==='Flop'||u.blink>0||(clip==='Drowsy'&&Math.sin(GAME.time*2.2)>.4);
    for(var li=0;li<u.lids.length;li++)u.lids[li].visible=shut;
    u.model.scale.y=u.model.scale.x*(P.stalk?.86:1);
    // how he feels, in his fur: green when sick, grey-blue when starving, a spiral of stink
    var tint=P.sickT>0?0xb8f0a0:(P.stink>0?0xd8f0b0:(P.hunger<=6?0xc8c8e0:0xffffff));
    if(CATMODEL.mat&&CATMODEL.mat.userData.tint!==tint){ CATMODEL.mat.color.setHex(tint); CATMODEL.mat.userData.tint=tint; }
    P.mesh.visible=!(P.hurtT>0&&Math.floor(P.hurtT*14)%2===0);
    P.mesh.rotation.z=P.dead?Math.min((P.deadT||0)*3,Math.PI/2):0;
    return;
  }
  if(P.mesh&&P.mesh.userData.isSprite){
    P.walk+=dt*(2.4+P.speed*3.1);
    var mv=P.speed>.4?1:0;
    P.mesh.position.set(P.pos.x,P.pos.y,P.pos.z);
    var hop=(mv?Math.abs(Math.sin(P.walk))*.035:0)+(P.grounded?0:.06);
    var drop=P.pos.y-groundBelow(P.pos.x,P.pos.z,P.pos.y);
    var statF=-1;
    if(P.dead)                 statF=7;   // flopped, spent
    else if(P.hurtT>0.72)      statF=6;   // the startle, first third of a hit
    else if(P.hurtT>0)         statF=4;   // then just battered
    else if(P.atkT>0)          statF=5;   // hissing, claws out
    else if(P.stink>0)         statF=2;   // skunked: spirals
    else if(P.sickT>9)         statF=1;   // deeply green
    else if(P.sickT>0)         statF=0;   // queasy
    else if(P.hunger<=6)       statF=3;   // woozy with hunger
    var idleF=-1;
    if(GAME.state==='pause')idleF=7;
    else if(statF<0&&P.idleT>2.0&&P.grounded&&!P.dead){
      idleF=idleFrameAt(P.idleT-2.0);
      if(idleF!==P.lastIdle){
        if(idleF===5)AU.tone(300,220,.5,'sine',.07);       // the yawn
        if(idleF===7)AU.purr();
        P.lastIdle=idleF;
      }
    } else P.lastIdle=-1;
    updateCatSprite(P.mesh,P.yaw,{
      status:statF,
      idle:idleF,
      drop:drop,
      lift:(idleF>=0||statF>=0)?0:hop,
      squash:1+(mv?Math.sin(P.walk*2)*.035:0)+(P.stalk?-.10:0),
      tilt:0,
      tint:0xffffff,
      shadow:P.grounded?1:.7});
    P.mesh.visible=!(P.hurtT>0&&Math.floor(P.hurtT*14)%2===0);
    return;
  }
  var u=P.parts; if(!u)return;
  var t=GAME.time;
  P.walk+=dt*(2.4+P.speed*3.1);
  var moving=P.speed>.4?1:0;
  P.mesh.position.set(P.pos.x,P.pos.y,P.pos.z);
  P.mesh.rotation.y=P.yaw;

  /* ---- which pose is he in? stop moving and he stretches, sits, then loafs ---- */
  var pose='walk';
  if(GAME.state==='pause')pose='loaf';
  else if(P.dead)pose='walk';
  else if(!P.grounded||P.atkT>0)pose='pounce';
  else if(moving)pose='walk';
  else if(P.idleT>15)pose='loaf';

  else if(P.idleT>3.4)pose='sit';
  else if(P.idleT>1.9)pose='stretch';
  P.pose=pose;

  // rest targets = the walk cycle; a pose overrides them
  var swing=[],i;
  for(i=0;i<4;i++){
    var off=(i<2?0:Math.PI)+(i%2?Math.PI:0);
    swing.push(Math.sin(P.walk+off)*(.55*moving+.03));
  }
  var T={bodyY:Math.abs(Math.sin(P.walk))*.055*moving-(P.stalk?.11:0),
         bodyRX:(P.speed>4?-.09:0), bodyRZ:0, headRX:(moving?-.05:0)+(P.hunger<20?.22:0),
         fl:swing[0],fr:swing[1],rl:swing[2],rr:swing[3],
         tuckF:0,tuckR:0, tailRX:-.55, curl:0, eyeS:1, rate:7};
  if(pose==='sit'){
    T.bodyY=.10; T.bodyRX=-.36; T.headRX=.04;
    T.fl=T.fr=-.12; T.rl=T.rr=1.45; T.tuckR=.1; T.tailRX=.55; T.curl=.5; T.rate=5;
  } else if(pose==='loaf'){
    T.bodyY=-.17; T.bodyRX=-.05; T.headRX=.14;
    T.fl=T.fr=1.4; T.rl=T.rr=1.4; T.tuckF=.15; T.tuckR=.15;
    T.tailRX=.75; T.curl=.8; T.eyeS=.3; T.rate=3.5;
  } else if(pose==='stretch'){
    T.bodyY=-.1; T.bodyRX=.34; T.headRX=-.24;
    T.fl=T.fr=-1.35; T.rl=T.rr=-.15; T.tailRX=-1.15; T.rate=5;
  } else if(pose==='pounce'){
    T.bodyY=.05; T.bodyRX=-.2; T.headRX=-.16;
    T.fl=-1.5; T.fr=-1.2; T.rl=T.rr=.55; T.tailRX=-1.25; T.rate=16;
  }

  var k=Math.min(1,dt*T.rate);
  u.body.position.y=lerp(u.body.position.y,T.bodyY,k);
  u.body.rotation.x=lerp(u.body.rotation.x,T.bodyRX,k);
  u.body.rotation.z=lerp(u.body.rotation.z,T.bodyRZ,k);
  u.body.rotation.y=lerp(u.body.rotation.y,pose==='pounce'?Math.sin(P.atkT/.26*Math.PI)*.3:0,k);
  var lt=[T.fl,T.fr,T.rl,T.rr], tk=[T.tuckF,T.tuckF,T.tuckR,T.tuckR];
  for(i=0;i<4;i++){
    u.legs[i].rotation.x=lerp(u.legs[i].rotation.x,lt[i],k);
    var by=u.legs[i].userData.baseY===undefined?.24:u.legs[i].userData.baseY;
    u.legs[i].position.y=lerp(u.legs[i].position.y,by+tk[i],k);
  }
  if(u.tailBase)u.tailBase.rotation.x=lerp(u.tailBase.rotation.x,T.tailRX,k);
  for(var s=0;s<u.tail.length;s++){
    var seg=u.tail[s];
    seg.rotation.y=lerp(seg.rotation.y,Math.sin(t*2.6-s*.5)*(.16+moving*.1)+T.curl*.34,Math.min(1,dt*6));
    seg.rotation.x=lerp(seg.rotation.x,Math.sin(t*1.9-s*.4)*.09+T.curl*.1,Math.min(1,dt*6));
  }
  u.ears[0].rotation.x=Math.sin(t*1.1)*.06+(P.hurtT>0?-.5:0)+(pose==='loaf'?-.15:0);
  u.ears[1].rotation.x=Math.sin(t*1.3+1)*.06+(P.hurtT>0?-.5:0)+(pose==='loaf'?-.15:0);
  u.head.rotation.x=lerp(u.head.rotation.x,T.headRX,Math.min(1,dt*5));
  u.head.rotation.z=Math.sin(t*.8)*.03;
  if(P.meowT)u.head.rotation.x-=.2;

  P.blinkT-=dt;
  if(P.blinkT<=0){ P.blink=.14; P.blinkT=rnd(2.4,6); }
  var es=T.eyeS;
  if(P.blink>0){ P.blink-=dt; es*=.12; }
  u.eyes[0].scale.y=lerp(u.eyes[0].scale.y,es,Math.min(1,dt*18));
  u.eyes[1].scale.y=u.eyes[0].scale.y;

  P.mesh.visible=!(P.hurtT>0&&Math.floor(P.hurtT*14)%2===0);
  if(P.dead){ P.mesh.rotation.z=Math.min((P.deadT||0)*3,Math.PI/2); }
  else P.mesh.rotation.z=0;
}

/* an interior wall between you and the cat goes see-through rather than shoving the camera */
function updateWallFade(dt){
  var fw=W.fadeWalls; if(!fw||!fw.length)return;
  var ax=camera.position.x, ay=camera.position.y, az=camera.position.z;
  var tx=P.pos.x, ty=P.pos.y+.4, tz=P.pos.z;
  for(var i=0;i<fw.length;i++){
    var f=fw[i], c=f.c, hit=false;
    for(var s=1;s<=12&&!hit;s++){
      var q=s/13;
      if(Math.abs(ax+(tx-ax)*q-c.x)<c.hx+.14&&
         Math.abs(ay+(ty-ay)*q-c.y)<c.hy+.14&&
         Math.abs(az+(tz-az)*q-c.z)<c.hz+.14)hit=true;
    }
    var m=f.m.material, want=hit?.14:1;
    m.opacity+=(want-m.opacity)*Math.min(1,dt*9);
    m.transparent=m.opacity<.995;
    m.depthWrite=m.opacity>.95;
  }
}

/* ============================ camera ============================ */
function updateCamera(dt,instant){
  var k=instant?1:Math.min(1,dt*8);
  CAM.look.x=lerp(CAM.look.x,P.pos.x,k);
  CAM.look.y=lerp(CAM.look.y,P.pos.y+.45+(CAM.lift||0),k);
  CAM.look.z=lerp(CAM.look.z,P.pos.z,k);
  // the rig is rigid: all the smoothing lives in the look target, so the lens never drifts into walls
  var hx=CAM.look.x, hy=P.pos.y+.55, hz=CAM.look.z;
  var cp=Math.cos(CAM.pitch);
  var ux=Math.sin(CAM.yaw)*cp, uy=Math.sin(CAM.pitch), uz=Math.cos(CAM.yaw)*cp;
  var want=CAM.dist, MIN=1.95, freeD=want;
  for(var st=1;st<=16;st++){
    var q=(st/16)*want;
    if(camBlocked(hx+ux*q,hy+uy*q,hz+uz*q,.34)){ freeD=Math.max(MIN,((st-1)/16)*want-.1); break; }
  }
  if(instant||freeD<CAM.cur)CAM.cur=freeD;                  // duck in at once
  else CAM.cur=lerp(CAM.cur,freeD,Math.min(1,dt*2.5));      // ease back out
  var px=hx+ux*CAM.cur, py=hy+uy*CAM.cur, pz=hz+uz*CAM.cur;
  if(py<P.pos.y+.2)py=P.pos.y+.2;
  CAM.shake=Math.max(0,CAM.shake-dt*2.2);
  var s=CAM.shake*.2;
  camera.position.set(px+rnd(-s,s),py+rnd(-s,s),pz+rnd(-s,s));
  CAM.pos.set(px,py,pz);
  camera.lookAt(CAM.look);
  if(P.mesh&&CAM.cur<1.25&&GAME.state!=='title')P.mesh.visible=false;
}

/* ============================ interactions & pickups ============================ */
var promptEl=$('prompt'), nearI=null;
function updateInteract(dt){
  nearI=null; var bestD=1e9;
  for(var i=0;i<W.interactables.length;i++){
    var o=W.interactables[i]; if(o.dead)continue;
    var d=Math.sqrt(Math.pow(o.x-P.pos.x,2)+Math.pow(o.z-P.pos.z,2));
    if(d>o.r)continue;
    if(Math.abs((o.y||0)-P.pos.y)>1.7)continue;
    if(d<bestD){bestD=d;nearI=o;}
  }
  var foe=(GAME.state==='play')?enemyInRange():null;
  if(foe){ promptEl.innerHTML='<kbd>E</kbd>Swipe'; promptEl.classList.add('on'); }
  else if(nearI){ promptEl.innerHTML='<kbd>E</kbd>'+nearI.label; promptEl.classList.add('on'); }
  else promptEl.classList.remove('on');
  if(pressed.act){
    pressed.act=false;
    if(foe){ playerAttack(); }
    else if(nearI&&GAME.state==='play'){
      nearI.fn();
      if(nearI.uses!==99){ nearI.uses--; if(nearI.uses<=0)nearI.dead=true; }
    } else if(GAME.state==='play'){ AU.meow(); P.meowT=.5; }
  }
  // pickups
  for(var p=W.pickups.length-1;p>=0;p--){
    var pk=W.pickups[p]; if(pk.dead)continue;
    pk.t+=dt;
    pk.mesh.rotation.y+=dt*1.2;
    pk.mesh.position.y=pk.y+Math.sin(pk.t*2)*.06;
    var pd=Math.sqrt(Math.pow(pk.x-P.pos.x,2)+Math.pow(pk.z-P.pos.z,2));
    if(pd<pk.r&&Math.abs(pk.y-P.pos.y)<1.5){
      pk.dead=true; W.root.remove(pk.mesh); W.pickups.splice(p,1);
      P.hunger=clamp(P.hunger+pk.amount,0,100); GAME.meals++;
      AU.chomp(); AU.purr();
      floatText(pk.x,pk.y+.7,pk.z,'+'+pk.amount+' tummy','#f2c98a');
      say('Biscuits',pk.label+'. '+pick(['Gone in four seconds.','You did not chew. Chewing is for cats with options.','Ten out of ten. Would find in a bin again.','You purr. Nobody hears it. You purr anyway.']),3.2);
      if(pk.onTake)pk.onTake();
    }
  }
  // triggers
  for(var t=0;t<W.triggers.length;t++){
    var tr=W.triggers[t];
    if(!tr.active||tr.dead)continue;
    if(P.pos.y<tr.ymin||P.pos.y>tr.ymax)continue;
    var td=Math.sqrt(Math.pow(tr.x-P.pos.x,2)+Math.pow(tr.z-P.pos.z,2));
    if(td<tr.r){ if(tr.once)tr.dead=true; tr.fn(); }
  }
}

var sayEl=$('say'), curSay=null, DQ=[];
function say(who,text,dur){
  DQ.push({who:who,text:text,dur:dur||3.4});
  while(DQ.length>6)DQ.shift();
}
function queueSay(list){ list.forEach(function(l){ DQ.push({who:l[0],text:l[1],dur:l[2]||3.6}); }); }
function updateDialog(dt){
  if(GAME.state!=='play'&&GAME.state!=='ending')return;
  if(curSay){
    curSay.t-=dt;
    if(curSay.t<=0){ curSay=null; sayEl.classList.remove('on'); }
    return;
  }
  if(DQ.length){
    curSay=DQ.shift();
    // long enough to actually read: half as long again, and never under ~3 words a second
    var words=String(curSay.text).split(/\s+/).length;
    curSay.t=Math.max(curSay.dur*1.5, 2.5+words*.36);
    sayEl.innerHTML='<span class="who">'+curSay.who+'</span>'+curSay.text;
    sayEl.classList.add('on');
  }
}

var BEG={on:false,pos:0,dir:1,speed:1,zone:[.4,.6],cb:null};
function startBeg(who,difficulty,cb){
  BEG.on=true; BEG.pos=0; BEG.dir=1; BEG.cb=cb;
  BEG.speed=.85+difficulty*.55;
  var w=.26-difficulty*.09;
  var start=rnd(.18,.82-w);
  BEG.zone=[start,start+w];
  $('begwho').textContent=who;
  $('begzone').style.left=(start*100)+'%';
  $('begzone').style.width=(w*100)+'%';
  $('beg').classList.add('on');
  GAME.state='beg';
}
function updateBeg(dt){
  BEG.pos+=BEG.dir*BEG.speed*dt;
  if(BEG.pos>1){BEG.pos=1;BEG.dir=-1;}
  if(BEG.pos<0){BEG.pos=0;BEG.dir=1;}
  $('begmark').style.left='calc('+(BEG.pos*100)+'% - 2px)';
}
function resolveBeg(){
  if(!BEG.on)return;
  BEG.on=false; $('beg').classList.remove('on'); GAME.state='play';
  var win=BEG.pos>=BEG.zone[0]&&BEG.pos<=BEG.zone[1];
  AU.meow(); P.meowT=.6;
  if(BEG.cb)BEG.cb(win);
}
$('begbtn').addEventListener('click',resolveBeg);
window.addEventListener('keydown',function(e){
  if(BEG.on&&(e.key===' '||e.key.toLowerCase()==='e')){ e.preventDefault(); resolveBeg(); }
});

// the intro film: Biscuits, on the sofa, before it all goes wrong. click or any key skips
function playIntro(done){
  var fin=false, box=document.createElement('div');
  box.style.cssText='position:fixed;inset:0;z-index:9999;background:#000;display:flex;'+
    'align-items:center;justify-content:center;cursor:pointer';

  v.style.cssText='width:100%;height:100%;object-fit:contain';

    'font:600 13px Nunito,sans-serif;letter-spacing:.08em';
  box.appendChild(v); box.appendChild(sk); document.body.appendChild(box);
  function end(){
    if(fin)return; fin=true;
    removeEventListener('keydown',key,true);

  function key(e){ e.stopPropagation(); e.preventDefault(); end(); }
  v.onended=end; v.onerror=end; box.onclick=end;

  var p=v.play(); if(p&&p.catch)p.catch(function(){ v.muted=true; v.play().catch(end); });

    '<div class="stats"><div class="stat"><b>'+Math.round(P.hunger)+'%</b><span>Tummy</span></div>'+
    '<div class="stat"><b>'+Math.ceil(P.hp)+'</b><span>Lives left</span></div>'+
    '<div class="stat"><b>'+GAME.meals+'</b><span>Meals</span></div></div>'+
    '<button class="btn" id="btnNext">KEEP GOING</button>');
  btnHook('btnNext',function(){ hideCard(); startLevel(GAME.level+1); });
}
function die(reason){
  if(P.dead)return;
  P.dead=true; P.ctrl=false; P.hp=0; GAME.deaths++; GAME.state='dead'; AU.lose();
  updateHud();
  setTimeout(function(){
    showCard('<div class="kicker">Down, but cats are good at this</div><h2>You flop over.</h2>'+
      '<p>'+reason+'</p><p>You wake up a little later, a little emptier, at the start of the day. '+
      'This has happened to better cats.</p>'+
      '<button class="btn" id="btnRetry">SHAKE IT OFF</button>'+
      '<button class="btn ghost" id="btnQuit">back to the title</button>');
    btnHook('btnRetry',function(){ hideCard(); P.hp=P.maxhp; P.hunger=Math.max(P.hunger,42); startLevel(GAME.level); });
    btnHook('btnQuit',function(){ hideCard(); titleScreen(); });
  },900);
}
var paused=false;
function togglePause(){
  if(GAME.state==='play'){
    GAME.state='pause';
    showCard('<div class="kicker">'+LEVELS[GAME.level].day+'</div><h2>Loaf mode</h2>'+
      '<p>Biscuits has folded his legs underneath himself and is waiting.</p>'+
      '<div class="keys"><div><kbd>W A S D</kbd>prowl</div><div><kbd>Space</kbd>jump</div>'+
      '<div><kbd>E</kbd>swipe / paw / beg</div><div><kbd>Q</kbd>meow</div>'+
      '<div><kbd>Shift</kbd>sprint</div><div><kbd>Ctrl</kbd>stalk</div></div>'+
      '<button class="btn" id="btnResume">UNLOAF</button>'+
      '<button class="btn ghost" id="btnRestart">restart this day</button>');
    btnHook('btnResume',function(){ hideCard(); GAME.state='play'; });
    btnHook('btnRestart',function(){ hideCard(); startLevel(GAME.level); });
  } else if(GAME.state==='pause'){ hideCard(); GAME.state='play'; }
}
function toggleMute(){
  AU.muted=!AU.muted;
  if(AU.bus)AU.bus.gain.value=AU.muted?0:.5;
  $('btnMute').style.opacity=AU.muted?.4:1;
}
btnHook('btnMute',toggleMute);
btnHook('btnPause',togglePause);

/* ============================ ending ============================ */
function endingSequence(owner){
  if(GAME.state!=='play')return;
  GAME.state='ending'; P.ctrl=false; P.vel.set(0,0,0);
  DQ.length=0; curSay=null;
  say('The Human','"...Biscuits?"',2.6);
  var phase=0,pt=0;
  W.ticks.push(function(dt){
    pt+=dt;
    var dx=owner.position.x-P.pos.x, dz=(owner.position.z-1.6)-P.pos.z;
    var d=Math.sqrt(dx*dx+dz*dz);
    if(phase===0){
      if(d>.35){
        P.pos.x+=dx/d*2.1*dt; P.pos.z+=dz/d*2.1*dt; P.speed=2.1;
        P.yaw=Math.atan2(dx,dz);
      } else { P.speed=0; phase=1; pt=0; AU.meow();
        say('Biscuits','You look up at them. You do not run. You have decided to be generous about this.',4.4);
      }
      owner.rotation.y=Math.atan2(P.pos.x-owner.position.x,P.pos.z-owner.position.z)+Math.PI;
      CAM.yaw=lerp(CAM.yaw,Math.PI,dt*1.2); CAM.dist=lerp(CAM.dist,5.2,dt*1.5);
    } else if(phase===1){
      owner.scale.y=lerp(owner.scale.y,.55,dt*2.2);
      owner.position.z=lerp(owner.position.z,P.pos.z+1.1,dt*2);
      CAM.dist=lerp(CAM.dist,3.6,dt*1.4); CAM.pitch=lerp(CAM.pitch,.18,dt*1.4);
      CAM.yaw+=dt*.22;
      if(pt>3.2){ phase=2; pt=0; AU.purr();
        say('The Human','"Three days. Three days, buddy. I’m so sorry. I’m never doing that again."',4.8);
      }
    } else if(phase===2){
      CAM.yaw+=dt*.22; CAM.dist=lerp(CAM.dist,4.2,dt);
      if(pt>4.6){
        say('Biscuits','You start purring before you decide to. Traitor. Delicious traitor.',4);
        phase=3; pt=0;
      }
    } else {
      CAM.yaw+=dt*.16;
      if(pt>4.2){ endCard(); return true; }
    }
    return false;
  });
}
function endCard(){
  GAME.state='done';
  var mins=Math.max(1,Math.round((performance.now()-GAME.startedAt)/60000));
  showCard(
    '<div class="kicker">The end</div><h1>Good Cat.</h1>'+
    '<p>Inside, there is a fresh bowl, an apology, and a human who will not be going out for a while. '+
    'You eat until the bowl is a mirror. You sleep on their chest specifically so they cannot get up.</p>'+
    '<p>You will never tell them about the raccoon.</p>'+
    '<div class="stats">'+
    '<div class="stat"><b>3</b><span>Days alone</span></div>'+
    '<div class="stat"><b>'+GAME.meals+'</b><span>Meals scavenged</span></div>'+
    '<div class="stat"><b>'+GAME.fights+'</b><span>Chased off</span></div>'+'<div class="stat"><b>'+(GAME.hunts||0)+'</b><span>Caught by paw</span></div>'+
    '<div class="stat"><b>'+GAME.begsWon+'</b><span>Successful begs</span></div>'+
    '<div class="stat"><b>'+GAME.deaths+'</b><span>Flops</span></div>'+
    '<div class="stat"><b>'+mins+'</b><span>Minutes outside</span></div>'+
    '</div>'+
    '<button class="btn" id="btnAgain">AGAIN</button>');
  btnHook('btnAgain',function(){ hideCard(); titleScreen(); });
  AU.win();
}

/* ============================ main loop ============================ */
var lastT=performance.now(), hudT=0;
function frame(now){
  requestAnimationFrame(frame);
  var dt=Math.min(.048,(now-lastT)/1000); lastT=now;
  if(GAME.state==='beg'){ updateBeg(dt); renderer.render(scene,camera); return; }
  var active=(GAME.state==='play'||GAME.state==='ending'||GAME.state==='dead');
  if(active){
    GAME.time+=dt;
    updatePlayer(dt);
    updateEnemies(dt);
    updateInteract(dt);
    if(P.dead)P.deadT=(P.deadT||0)+dt;
    // world ticks
    for(var i=W.ticks.length-1;i>=0;i--){
      if(W.ticks[i](dt,GAME.time))W.ticks.splice(i,1);
    }
  } else if(GAME.state==='title'||GAME.state==='card'||GAME.state==='pause'){
    GAME.time+=dt; animateCat(dt);
    if(GAME.state==='title')CAM.yaw+=dt*.22;
  }
  updateDialog(dt);
  updateCamera(dt);
  updateWallFade(dt);
  updateZ(dt);
  updatePushables(dt);
  hudT+=dt; if(hudT>.08){ hudT=0; updateHud(); }
  renderer.render(scene,camera);
}

/* ============================ boot ============================ */
function boot(saved){ loadAptTextures(function(){ bootReal(saved); }); }
function bootReal(saved){
  makePlayerMesh();
  clearWorld();
  buildApartment();
  DQ.length=0;
  P.pos.set(-4,0,4); P.yaw=Math.PI*.8;
  CAM.dist=5.8; CAM.pitch=.5; CAM.lift=0;
  updateCamera(0,true);
  $('loading').style.display='none';
  titleScreen();
  if(saved&&saved.level>0&&saved.level<LEVELS.length){
    GAME.meals=saved.meals||0; GAME.fights=saved.fights||0; GAME.begsWon=saved.begsWon||0;
    P.hunger=saved.hunger||40; P.hp=saved.hp||9;
    hideCard(); startLevel(saved.level);
  }
  requestAnimationFrame(frame);
}
try{
  if(window.claude&&window.claude.hot){
    window.claude.hot.snapshot(function(){
      return {level:GAME.level,meals:GAME.meals,fights:GAME.fights,begsWon:GAME.begsWon,
        hunger:P.hunger,hp:P.hp,playing:GAME.state==='play'};
    });
  }
}catch(e){}
try{
  if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(boot);
  else boot((window.claude&&window.claude.hot&&window.claude.hot.data)||null);
}catch(e){ boot(null); }
window.AC={startLevel:startLevel,startRun:startRun,GAME:GAME,P:P,W:W,CAM:CAM,cam:camera,scene:scene,
  hop:function(i){startRun();startLevel(i);GAME.state='play';hideCard();}};
})();
</script>
